<script>
'use strict';
// ---- engine.js ----
// ===================== Симфония трёх — game engine (port of Engine.kt) =====================

const NORMAL = 0, STRIPE_H = 1, STRIPE_V = 2, WRAPPED = 3, BOMB = 4, INGR = 5, PROP = 6;
const FLY_T = 0.42;

const BN_TNT = 1, BN_LIGHT = 2, BN_TIME = 3, BN_MULT = 4, BN_CRYST = 5, BN_TUNE = 6, BN_STAR = 7, BN_COUNT = 8;
const K_DYN = 20, K_LIGHT = 21, K_TUNE = 22;

const B_ICE_HIT = 0, B_ICE_BREAK = 1, B_CHOC = 2, B_LOCK = 3, B_JELLY = 4, B_CHOC_GROW = 5,
  B_BOX = 6, B_ORGAN = 7, B_PAL = 8, B_CAB = 9, B_GONE = 10;

const BK_BOX = 1, BK_ORGAN = 2, BK_PAL = 3, BK_CAB = 4;

const DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];

// ---------- seeded RNG (mulberry32) ----------
class Rng {
  constructor(seed) {
    if (seed === undefined) seed = (Math.random() * 4294967296) >>> 0;
    // mix 64-bit-ish seeds down to 32 bits
    let s = Number(seed);
    let h = 2166136261 >>> 0;
    const str = String(s);
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    this.s = h || 1;
  }
  next32() {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0);
  }
  nextFloat() { return this.next32() / 4294967296; }
  nextInt(a, b) {
    if (b === undefined) return Math.floor(this.nextFloat() * a);
    return a + Math.floor(this.nextFloat() * (b - a));
  }
  nextBoolean() { return this.nextFloat() < 0.5; }
  shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = this.nextInt(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
}

let pieceCounter = 0;
class Piece {
  constructor(color, kind) {
    this.id = pieceCounter++;
    this.color = color; this.kind = kind;
    this.vx = 0; this.vy = 0; this.speed = 0;
    this.path = [];
    this.primed = false;
    this.appear = 1; this.squash = 0;
    this.crystal = false; this.bonus = 0;
  }
  get matchable() { return this.kind <= WRAPPED || this.kind === PROP; }
  get isSpecial() { return (this.kind >= STRIPE_H && this.kind <= BOMB) || this.kind === PROP; }
}

class StepResult {
  constructor() {
    this.clears = []; this.beams = []; this.blasts = []; this.bolts = []; this.blocks = [];
    this.creates = []; this.collects = []; this.flies = []; this.crystals = []; this.bonuses = [];
    this.fires = []; this.gifts = []; this.matchColors = [];
    this.points = 0; this.cascade = 0; this.bombCombo = false;
  }
  maxDelay() {
    let m = 0;
    for (const c of this.clears) m = Math.max(m, c.delay);
    for (const b of this.blocks) m = Math.max(m, b.delay);
    for (const b of this.bolts) m = Math.max(m, b.delay);
    for (const f of this.flies) m = Math.max(m, f.delay + FLY_T);
    for (const f of this.fires) m = Math.max(m, f.delay + 0.4);
    for (const c of this.crystals) m = Math.max(m, c.delay);
    return m;
  }
}

class Board {
  constructor(w, h, colors, rng) {
    this.w = w; this.h = h; this.colors = colors; this.rng = rng;
    const n = this.n = w * h;
    this.mask = new Array(n).fill(true);
    this.pieces = new Array(n).fill(null);
    this.jelly = new Int32Array(n);
    this.ice = new Int32Array(n);
    this.choc = new Array(n).fill(false);
    this.lock = new Array(n).fill(false);
    this.blk = new Int32Array(n);
    this.blkHp = new Int32Array(n);
    this.palMask = new Int32Array(n);
    this.cabAnchor = new Int32Array(n).fill(-1);
    this.organNotes = 0; this.organGoal = 0;
    this.cabHit = new Set();
    this.sim = false;
    this.score = 0;
    this.collected = new Int32Array(6);
    this.ingrCollected = 0; this.ingrRemaining = 0; this.ingrMaxOnBoard = 2;
    this.chocBroken = false;
    this.cascade = 0;
    this.collectNeed = new Int32Array(6);
    this.ingrGoal = false;
    this.crystalsCollected = 0;
    this.crystalChance = 0.065;
    this.bonusKinds = [];
    this.bonusChance = 0;
    this.maxBonuses = 3;
    this.bonusPower = new Int32Array(BN_COUNT).fill(1);
    this.targeted = new Set();
    this.res = new StepResult();
    this.queue = [];
  }

  cx(i) { return i % this.w; }
  cy(i) { return (i / this.w) | 0; }
  idx(x, y) { return y * this.w + x; }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  open(i) { return this.mask[i] && this.ice[i] === 0 && !this.choc[i] && this.blk[i] === 0; }
  movable(i) { const p = this.pieces[i]; if (!p) return false; return this.open(i) && !this.lock[i] && !p.primed; }
  colorAt(i) {
    if (!this.open(i)) return -1;
    const p = this.pieces[i]; if (!p) return -1;
    return (p.matchable && !p.primed) ? p.color : -1;
  }
  addPath(p, i) { if (!this.sim) p.path.push(i); }
  place(p, i) { p.vx = this.cx(i); p.vy = this.cy(i); this.pieces[i] = p; }
  reset(cascade1) { this.res = new StepResult(); this.queue = []; this.targeted.clear(); this.cabHit.clear(); if (cascade1) this.cascade = 1; }

  // ---------- Initial fill ----------
  safeColor(i) {
    const x = this.cx(i), y = this.cy(i), w = this.w, h = this.h;
    const bad = new Array(this.colors).fill(false);
    const ca = (xx, yy) => this.colorAt(this.idx(xx, yy));
    if (x >= 2) { const a = ca(x - 1, y); if (a >= 0 && a === ca(x - 2, y)) bad[a] = true; }
    if (y >= 2) { const a = ca(x, y - 1); if (a >= 0 && a === ca(x, y - 2)) bad[a] = true; }
    if (x < w - 2) { const a = ca(x + 1, y); if (a >= 0 && a === ca(x + 2, y)) bad[a] = true; }
    if (y < h - 2) { const a = ca(x, y + 1); if (a >= 0 && a === ca(x, y + 2)) bad[a] = true; }
    for (let dy = -1; dy <= 0; dy++) for (let dx = -1; dx <= 0; dx++) {
      const x0 = x + dx, y0 = y + dy;
      if (x0 < 0 || y0 < 0 || x0 + 1 >= w || y0 + 1 >= h) continue;
      let col = -2, ok4 = true;
      for (let yy = y0; yy <= y0 + 1; yy++) for (let xx = x0; xx <= x0 + 1; xx++) {
        if (xx === x && yy === y) continue;
        const cc = ca(xx, yy);
        if (cc < 0 || (col !== -2 && cc !== col)) ok4 = false;
        col = cc;
      }
      if (ok4 && col >= 0) bad[col] = true;
    }
    const ok = []; for (let c = 0; c < this.colors; c++) if (!bad[c]) ok.push(c);
    return ok.length === 0 ? this.rng.nextInt(this.colors) : ok[this.rng.nextInt(ok.length)];
  }

  fillInitial() {
    const n = this.n;
    for (let attempt = 0; attempt < 60; attempt++) {
      for (let i = 0; i < n; i++) { const p = this.pieces[i]; if (this.open(i) && (p === null || p.kind === NORMAL)) this.pieces[i] = null; }
      for (let i = 0; i < n; i++) if (this.open(i) && this.pieces[i] === null) this.place(new Piece(this.safeColor(i), NORMAL), i);
      if (this.findGroups().length === 0 && this.findMoves().length >= 3) break;
    }
    for (let i = 0; i < n; i++) {
      const p = this.pieces[i]; if (!p) continue;
      if (p.kind === NORMAL && this.open(i) && this.rng.nextFloat() < this.crystalChance * 0.8) p.crystal = true;
    }
    if (this.bonusKinds.length > 0) for (let i = 0; i < n; i++) {
      const p = this.pieces[i]; if (!p) continue;
      if (p.kind === NORMAL && !p.crystal && this.open(i) && this.bonusesOnBoard() < this.maxBonuses && this.rng.nextFloat() < this.bonusChance * 0.7)
        p.bonus = this.bonusKinds[this.rng.nextInt(this.bonusKinds.length)];
    }
  }

  crystalsOnBoard() { let c = 0; for (const p of this.pieces) if (p && p.crystal) c++; return c; }
  bonusesOnBoard() { let c = 0; for (const p of this.pieces) if (p && p.bonus > 0) c++; return c; }

  // ---------- Matching ----------
  findGroups() {
    const runs = [], types = [];
    const w = this.w, h = this.h;
    for (let y = 0; y < h; y++) {
      let x = 0;
      while (x < w) {
        const c = this.colorAt(this.idx(x, y));
        if (c < 0) { x++; continue; }
        let e = x + 1;
        while (e < w && this.colorAt(this.idx(e, y)) === c) e++;
        if (e - x >= 3) { const r = []; for (let k = x; k < e; k++) r.push(this.idx(k, y)); runs.push(r); types.push(0); }
        x = e;
      }
    }
    for (let x = 0; x < w; x++) {
      let y = 0;
      while (y < h) {
        const c = this.colorAt(this.idx(x, y));
        if (c < 0) { y++; continue; }
        let e = y + 1;
        while (e < h && this.colorAt(this.idx(x, e)) === c) e++;
        if (e - y >= 3) { const r = []; for (let k = y; k < e; k++) r.push(this.idx(x, k)); runs.push(r); types.push(1); }
        y = e;
      }
    }
    for (let y = 0; y < h - 1; y++) for (let x = 0; x < w - 1; x++) {
      const c = this.colorAt(this.idx(x, y));
      if (c < 0) continue;
      if (this.colorAt(this.idx(x + 1, y)) === c && this.colorAt(this.idx(x, y + 1)) === c && this.colorAt(this.idx(x + 1, y + 1)) === c) {
        runs.push([this.idx(x, y), this.idx(x + 1, y), this.idx(x, y + 1), this.idx(x + 1, y + 1)]); types.push(2);
      }
    }
    if (runs.length === 0) return [];
    const parent = runs.map((_, i) => i);
    const find = (a) => { let r = a; while (parent[r] !== r) r = parent[r]; return r; };
    const owner = new Map();
    runs.forEach((run, ri) => {
      for (const c of run) {
        const o = owner.get(c);
        if (o !== undefined) { const ra = find(ri), rb = find(o); if (ra !== rb) parent[ra] = rb; } else owner.set(c, ri);
      }
    });
    const groups = new Map();
    runs.forEach((run, ri) => {
      const key = find(ri);
      let g = groups.get(key);
      if (!g) { g = { cells: new Set(), runs: [], types: [] }; groups.set(key, g); }
      g.runs.push(run); g.types.push(types[ri]); for (const c of run) g.cells.add(c);
    });
    return Array.from(groups.values());
  }

  decide(g, pref) {
    let maxLen = 0, hasH = false, hasV = false, hasSq = false, longest = null, longestH = true;
    for (let k = 0; k < g.runs.length; k++) {
      const r = g.runs[k], t = g.types[k];
      if (t === 2) { hasSq = true; continue; }
      if (r.length > maxLen) { maxLen = r.length; longest = r; longestH = t === 0; }
      if (t === 0) hasH = true; else hasV = true;
    }
    let kind;
    if (maxLen >= 5) kind = BOMB;
    else if (hasH && hasV) kind = WRAPPED;
    else if (maxLen === 4) kind = longestH ? STRIPE_V : STRIPE_H;
    else if (hasSq) kind = PROP;
    else return null;
    let cell = -1;
    if (pref) for (const p of pref) if (g.cells.has(p) && !this.lock[p]) { cell = p; break; }
    if (cell < 0 && kind === WRAPPED) {
      const hc = new Set(), vc = new Set();
      for (let k = 0; k < g.runs.length; k++) for (const c of g.runs[k]) { if (g.types[k] === 0) hc.add(c); else if (g.types[k] === 1) vc.add(c); }
      for (const c of hc) if (vc.has(c) && !this.lock[c]) { cell = c; break; }
    }
    const main = longest || g.runs[0];
    if (cell < 0) { const c = main[(main.length / 2) | 0]; if (!this.lock[c]) cell = c; }
    if (cell < 0) for (const c of g.cells) if (!this.lock[c]) { cell = c; break; }
    if (cell < 0) return null;
    return [kind, cell];
  }

  isExit(i) {
    const x = this.cx(i); let yy = this.cy(i) + 1;
    while (yy < this.h) { if (this.mask[this.idx(x, yy)]) return false; yy++; }
    return true;
  }

  beginTurn() { this.cascade = 0; this.chocBroken = false; }

  // ---------- Clear phase ----------
  clearPhase(pref) {
    this.reset(false);
    const res = this.res;
    const s0 = this.score;
    let any = false;
    for (let i = 0; i < this.n; i++) { const p = this.pieces[i]; if (p && p.primed) { this.queue.push({ p, i, delay: 0, second: true }); any = true; } }
    const groups = this.findGroups();
    const creations = [];
    if (groups.length > 0) {
      any = true;
      this.cascade++;
      const matched = new Set();
      for (const g of groups) {
        const color = this.colorAt(g.cells.values().next().value);
        res.matchColors.push(color);
        const d = this.decide(g, pref);
        if (d) creations.push([d[1], d[0], color]);
        for (const c of g.cells) matched.add(c);
      }
      const adj = new Set();
      for (const g of groups) {
        const col = this.colorAt(g.cells.values().next().value);
        for (const c of g.cells) {
          const x = this.cx(c), y = this.cy(c);
          for (let k = 0; k < 4; k++) {
            const nx = x + DX[k], ny = y + DY[k];
            if (!this.inb(nx, ny)) continue;
            const j = this.idx(nx, ny);
            if (this.mask[j] && (this.ice[j] > 0 || this.choc[j] || this.blk[j] > 0)) adj.add(j * 16 + (col + 1));
          }
        }
      }
      for (const c of matched) this.hitCell(c, 0, false);
      for (const a of adj) this.hitCell((a / 16) | 0, 0.05, false, (a % 16) - 1);
    }
    this.processQueue();
    for (const cr of creations) {
      const cell = cr[0];
      if (this.pieces[cell] === null && this.open(cell)) {
        const p = new Piece(cr[2], cr[1]); this.place(p, cell); p.appear = 0;
        this.score += cr[1] === BOMB ? 300 : cr[1] === WRAPPED ? 200 : cr[1] === PROP ? 100 : 120;
        res.creates.push({ piece: p, i: cell });
      }
    }
    for (let i = 0; i < this.n; i++) {
      const p = this.pieces[i]; if (!p) continue;
      if (p.kind === INGR && this.open(i) && this.isExit(i)) {
        this.pieces[i] = null; this.ingrCollected++; this.score += 1000;
        res.collects.push({ piece: p, i }); any = true;
      }
    }
    if (!any && res.clears.length === 0 && res.blocks.length === 0) return null;
    res.points = this.score - s0;
    res.cascade = this.cascade;
    return res;
  }

  hitCell(i, delay, bySpecial, color = -1) {
    if (i < 0 || i >= this.n || !this.mask[i]) return;
    const res = this.res;
    if (this.blk[i] > 0) { this.hitBlocker(i, delay, color); return; }
    if (this.ice[i] > 0) {
      this.ice[i]--;
      res.blocks.push({ i, type: this.ice[i] === 0 ? B_ICE_BREAK : B_ICE_HIT, delay });
      this.score += this.ice[i] === 0 ? 100 : 40;
      return;
    }
    if (this.choc[i]) { this.choc[i] = false; this.chocBroken = true; res.blocks.push({ i, type: B_CHOC, delay }); this.score += 60; return; }
    const p = this.pieces[i]; if (!p) return;
    if (p.kind === INGR || p.primed) return;
    if (this.lock[i]) { this.lock[i] = false; res.blocks.push({ i, type: B_LOCK, delay }); this.score += 60; return; }
    this.removeAt(i, delay, bySpecial ? 40 : 20 * Math.max(1, this.cascade));
    if (p.isSpecial) this.queue.push({ p, i, delay: delay + 0.05 });
  }

  hitBlocker(i, d, color) {
    const res = this.res;
    switch (this.blk[i]) {
      case BK_BOX:
        this.blkHp[i]--; this.score += 60;
        if (this.blkHp[i] <= 0) { this.blk[i] = 0; res.blocks.push({ i, type: B_GONE, delay: d }); } else res.blocks.push({ i, type: B_BOX, delay: d });
        break;
      case BK_ORGAN:
        if (this.organNotes < this.organGoal) {
          this.organNotes++; this.score += 80; res.blocks.push({ i, type: B_ORGAN, delay: d });
          if (this.organNotes >= this.organGoal) for (let j = 0; j < this.n; j++) if (this.blk[j] === BK_ORGAN) { this.blk[j] = 0; res.blocks.push({ i: j, type: B_GONE, delay: d + 0.3 }); }
        }
        break;
      case BK_PAL: {
        const need = (1 << this.colors) - 1;
        let c = color;
        if (c < 0 || c >= this.colors || (this.palMask[i] & (1 << c)) !== 0) {
          const missing = []; for (let k = 0; k < this.colors; k++) if ((this.palMask[i] & (1 << k)) === 0) missing.push(k);
          c = missing.length === 0 ? -1 : missing[this.rng.nextInt(missing.length)];
        }
        if (c >= 0) { this.palMask[i] |= (1 << c); this.score += 50; res.blocks.push({ i, type: B_PAL, delay: d }); }
        if ((this.palMask[i] & need) === need) { this.blk[i] = 0; this.palMask[i] = 0; this.score += 200; res.blocks.push({ i, type: B_GONE, delay: d + 0.05 }); }
        break;
      }
      case BK_CAB: {
        const a = this.cabAnchor[i]; if (a < 0 || this.cabHit.has(a)) return;
        this.cabHit.add(a);
        this.blkHp[a]--; this.score += 60;
        if (this.blkHp[a] <= 0) {
          for (let j = 0; j < this.n; j++) if (this.cabAnchor[j] === a) { this.blk[j] = 0; this.cabAnchor[j] = -1; res.blocks.push({ i: j, type: B_GONE, delay: d }); }
          this.score += 400;
        } else res.blocks.push({ i: a, type: B_CAB, delay: d });
        break;
      }
    }
  }

  blockersLeft(type) { let c = 0; for (let i = 0; i < this.n; i++) if (this.blk[i] === type && (type !== BK_CAB || this.cabAnchor[i] === i)) c++; return c; }

  toolLine(i, horizontal) {
    this.reset(true);
    const s0 = this.score;
    this.res.beams.push({ i, horizontal, delay: 0, color: 4 });
    const x = this.cx(i), y = this.cy(i);
    if (horizontal) for (let xx = 0; xx < this.w; xx++) this.hitCell(this.idx(xx, y), Math.abs(xx - x) * 0.03, true);
    else for (let yy = 0; yy < this.h; yy++) this.hitCell(this.idx(x, yy), Math.abs(yy - y) * 0.03, true);
    this.processQueue(); this.res.points = this.score - s0;
    return this.res;
  }

  isSpecialAt(i) { const p = this.pieces[i]; if (!p) return false; return this.open(i) && !this.lock[i] && p.isSpecial && !p.primed; }

  removeAt(i, delay, pts) {
    const p = this.pieces[i]; if (!p) return;
    const res = this.res;
    this.pieces[i] = null;
    if (this.jelly[i] > 0) { this.jelly[i]--; res.blocks.push({ i, type: B_JELLY, delay }); this.score += 100; }
    if (p.kind !== BOMB && p.kind !== INGR) this.collected[p.color]++;
    this.score += pts;
    res.clears.push({ piece: p, i, delay, points: pts });
    if (p.crystal) { p.crystal = false; this.crystalsCollected++; this.score += 50; res.crystals.push({ i, delay }); }
    if (p.bonus > 0) { const k = p.bonus; p.bonus = 0; this.triggerBonus(k, i, delay, p.color); }
  }

  triggerBonus(k, i, d, color) {
    this.res.bonuses.push({ i, kind: k, delay: d, color });
    const pw = this.bonusPower[k];
    if (k === BN_TNT) this.queue.push({ p: new Piece(color, K_DYN), i, delay: d + 0.05 });
    else if (k === BN_LIGHT) this.queue.push({ p: new Piece(color, K_LIGHT), i, delay: d + 0.05 });
    else if (k === BN_TUNE) this.queue.push({ p: new Piece(color, K_TUNE), i, delay: d + 0.05 });
    else if (k === BN_CRYST) this.crystalsCollected += 1 + pw;
  }

  processQueue() {
    let k = 0;
    while (k < this.queue.length) { this.activate(this.queue[k]); k++; }
    this.queue = [];
  }

  mostCommonColor() {
    const cnt = new Array(this.colors).fill(0);
    for (let i = 0; i < this.n; i++) { const c = this.colorAt(i); if (c >= 0) cnt[c]++; }
    let best = 0;
    for (let c = 1; c < this.colors; c++) if (cnt[c] > cnt[best]) best = c;
    return best;
  }

  dist(a, b) { return Math.max(Math.abs(this.cx(a) - this.cx(b)), Math.abs(this.cy(a) - this.cy(b))); }

  activate(a) {
    const p = a.p, i = a.i, x = this.cx(i), y = this.cy(i), d = a.delay, res = this.res;
    switch (p.kind) {
      case STRIPE_H:
        res.beams.push({ i, horizontal: true, delay: d, color: p.color });
        for (let xx = 0; xx < this.w; xx++) if (xx !== x) this.hitCell(this.idx(xx, y), d + Math.abs(xx - x) * 0.03, true);
        break;
      case STRIPE_V:
        res.beams.push({ i, horizontal: false, delay: d, color: p.color });
        for (let yy = 0; yy < this.h; yy++) if (yy !== y) this.hitCell(this.idx(x, yy), d + Math.abs(yy - y) * 0.03, true);
        break;
      case WRAPPED:
        res.blasts.push({ i, radius: 2, delay: d, color: p.color });
        for (let yy = y - 2; yy <= y + 2; yy++) for (let xx = x - 2; xx <= x + 2; xx++) {
          if (!this.inb(xx, yy)) continue;
          const j = this.idx(xx, yy);
          if (j !== i) this.hitCell(j, d + 0.04 + Math.max(Math.abs(xx - x), Math.abs(yy - y)) * 0.03, true);
        }
        break;
      case PROP:
        this.crossHit(i, d);
        this.launchProp(i, d + 0.1, p.color, NORMAL);
        break;
      case BOMB:
        this.fireBomb(i, this.mostCommonColor(), d, NORMAL);
        break;
      case K_DYN: {
        const rad = this.bonusPower[BN_TNT] >= 3 ? 2 : 1;
        res.blasts.push({ i, radius: rad, delay: d, color: p.color });
        for (let yy = y - rad; yy <= y + rad; yy++) for (let xx = x - rad; xx <= x + rad; xx++) if (this.inb(xx, yy) && this.idx(xx, yy) !== i) this.hitCell(this.idx(xx, yy), d + 0.05, true);
        break;
      }
      case K_LIGHT: {
        const cnt = 2 + this.bonusPower[BN_LIGHT] * 2;
        for (let k = 0; k < cnt; k++) {
          const t = this.pickTarget(-1); if (t < 0) break;
          this.targeted.add(t);
          res.bolts.push({ from: i, to: t, delay: d + k * 0.06, color: 2 });
          this.hitCell(t, d + k * 0.06 + 0.08, true);
        }
        break;
      }
      case K_TUNE: {
        const cells = [];
        for (let j = 0; j < this.n; j++) if (this.colorAt(j) === p.color) cells.push(j);
        cells.sort((u, v) => this.dist(i, u) - this.dist(i, v));
        const take = this.bonusPower[BN_TUNE] >= 4 ? cells.length : Math.floor(cells.length * (0.4 + 0.15 * this.bonusPower[BN_TUNE]));
        cells.slice(0, take).forEach((j, k) => {
          res.bolts.push({ from: i, to: j, delay: d + 0.05 + k * 0.03, color: p.color });
          this.hitCell(j, d + 0.1 + k * 0.03, true);
        });
        break;
      }
    }
  }

  // ---------- Totems ----------
  totemFire(count) {
    this.reset(true);
    const s0 = this.score;
    for (let k = 0; k < count; k++) {
      const t = this.pickTarget(-1); if (t < 0) break;
      this.targeted.add(t);
      const d = k * 0.09;
      this.res.fires.push({ to: t, delay: d, steel: false });
      this.hitCell(t, d + 0.4, true);
    }
    this.processQueue(); this.res.points = this.score - s0;
    return this.res;
  }

  totemSteel(count) {
    this.reset(true);
    const s0 = this.score;
    const cells = [];
    for (let i = 0; i < this.n; i++) if (this.mask[i] && (this.ice[i] > 0 || this.choc[i] || this.lock[i] || (this.blk[i] > 0 && (this.blk[i] !== BK_CAB || this.cabAnchor[i] === i)))) cells.push(i);
    this.rng.shuffled(cells).slice(0, count).forEach((t, k) => {
      const d = k * 0.08;
      this.res.fires.push({ to: t, delay: d, steel: true });
      this.hitCell(t, d + 0.4, true);
    });
    this.processQueue(); this.res.points = this.score - s0;
    return this.res;
  }

  totemCrystals(max) {
    this.reset(false);
    const s0 = this.score;
    let k = 0;
    for (let i = 0; i < this.n; i++) {
      const p = this.pieces[i]; if (!p) continue;
      if (!p.crystal || k >= max) continue;
      p.crystal = false; this.crystalsCollected++; this.score += 50;
      this.res.crystals.push({ i, delay: k * 0.05 }); k++;
    }
    this.res.points = this.score - s0;
    return this.res;
  }

  totemGifts(count) {
    this.reset(false);
    if (this.bonusKinds.length === 0) return this.res;
    const cells = [];
    for (let i = 0; i < this.n; i++) { const p = this.pieces[i]; if (p && p.kind === NORMAL && p.bonus === 0 && this.open(i)) cells.push(i); }
    for (const i of this.rng.shuffled(cells).slice(0, count)) { this.pieces[i].bonus = this.bonusKinds[this.rng.nextInt(this.bonusKinds.length)]; this.res.gifts.push(i); }
    return this.res;
  }

  crossHit(i, d) {
    const x = this.cx(i), y = this.cy(i);
    for (let k = 0; k < 4; k++) { const nx = x + DX[k], ny = y + DY[k]; if (this.inb(nx, ny)) this.hitCell(this.idx(nx, ny), d + 0.04, true); }
  }

  pickTarget(from) {
    let best = -1, bv = -1e9;
    for (let j = 0; j < this.n; j++) {
      if (!this.mask[j] || j === from || this.targeted.has(j)) continue;
      let v;
      if (this.blk[j] > 0) v = (this.blk[j] === BK_ORGAN && this.organNotes >= this.organGoal) ? -1 : 9.5;
      else if (this.ice[j] > 0) v = 10 + this.ice[j];
      else if (this.choc[j]) v = 9;
      else {
        const p = this.pieces[j]; if (!p) continue;
        if (p.kind === INGR || p.primed) continue;
        v = 1;
        if (this.lock[j]) v += 7;
        if (this.jelly[j] > 0) v += 5 + this.jelly[j];
        if (p.kind !== BOMB && p.color >= 0 && p.color <= 5 && this.collected[p.color] < this.collectNeed[p.color]) v += 4;
        if (this.ingrGoal && this.cy(j) > 0) { const up = this.pieces[j - this.w]; if (up && up.kind === INGR) v += 9; }
        if (p.isSpecial) v -= 0.5;
      }
      if (from >= 0 && this.dist(from, j) <= 1) v -= 3;
      v += this.rng.nextFloat() * 0.9;
      if (v > bv) { bv = v; best = j; }
    }
    return best;
  }

  launchProp(from, d, color, carry) {
    const t = this.pickTarget(from);
    if (t < 0) return;
    this.targeted.add(t);
    this.res.flies.push({ from, to: t, delay: d, color, carry });
    this.hitCell(t, d + FLY_T, true);
    if (carry !== NORMAL) this.queue.push({ p: new Piece(color, carry), i: t, delay: d + FLY_T + 0.02 });
  }

  fireBomb(from, color, d, convert) {
    this.res.bombCombo = true;
    const targets = [];
    for (let j = 0; j < this.n; j++) if (this.colorAt(j) === color) targets.push(j);
    targets.sort((u, v) => this.dist(from, u) - this.dist(from, v));
    targets.forEach((j, k) => {
      const td = d + 0.08 + k * 0.035;
      this.res.bolts.push({ from, to: j, delay: td, color });
      if (convert !== NORMAL) {
        const p = this.pieces[j];
        p.kind = convert === STRIPE_H ? (this.rng.nextBoolean() ? STRIPE_H : STRIPE_V) : convert;
      }
      this.hitCell(j, td + 0.05, true);
    });
  }

  // ---------- Swaps ----------
  runAt(i) {
    const c = this.colorAt(i); if (c < 0) return 0;
    const x = this.cx(i), y = this.cy(i);
    let l = x; while (l > 0 && this.colorAt(this.idx(l - 1, y)) === c) l--;
    let r = x; while (r < this.w - 1 && this.colorAt(this.idx(r + 1, y)) === c) r++;
    let u = y; while (u > 0 && this.colorAt(this.idx(x, u - 1)) === c) u--;
    let dd = y; while (dd < this.h - 1 && this.colorAt(this.idx(x, dd + 1)) === c) dd++;
    return (r - l + 1) * 16 + (dd - u + 1);
  }

  squareAt(i) {
    const c = this.colorAt(i); if (c < 0) return false;
    const x = this.cx(i), y = this.cy(i);
    for (let dy = -1; dy <= 0; dy++) for (let dx = -1; dx <= 0; dx++) {
      const x0 = x + dx, y0 = y + dy;
      if (x0 < 0 || y0 < 0 || x0 + 1 >= this.w || y0 + 1 >= this.h) continue;
      if (this.colorAt(this.idx(x0, y0)) === c && this.colorAt(this.idx(x0 + 1, y0)) === c && this.colorAt(this.idx(x0, y0 + 1)) === c && this.colorAt(this.idx(x0 + 1, y0 + 1)) === c) return true;
    }
    return false;
  }

  cellValue(i) { const v = this.runValue(this.runAt(i)); return (this.squareAt(i) && v < 7) ? v + 5 : v; }

  runValue(code) {
    const hl = (code / 16) | 0, vl = code % 16;
    if (hl < 3 && vl < 3) return 0;
    let v = 0;
    if (hl >= 3) v += hl;
    if (vl >= 3) v += vl;
    if (hl >= 5 || vl >= 5) v += 12; else if (hl >= 3 && vl >= 3) v += 7; else if (hl === 4 || vl === 4) v += 4;
    return v;
  }

  swapKind(a, b) {
    if (!this.movable(a) || !this.movable(b)) return 0;
    const pa = this.pieces[a], pb = this.pieces[b];
    if (pa.kind === INGR && pb.kind === INGR) return 0;
    if ((pa.kind === BOMB && pb.kind !== INGR) || (pb.kind === BOMB && pa.kind !== INGR)) return 2;
    if (pa.isSpecial && pb.isSpecial) return 2;
    if ((pa.kind === PROP && pb.kind === NORMAL) || (pb.kind === PROP && pa.kind === NORMAL)) return 2;
    this.pieces[a] = pb; this.pieces[b] = pa;
    const ok = this.cellValue(a) > 0 || this.cellValue(b) > 0;
    this.pieces[a] = pa; this.pieces[b] = pb;
    return ok ? 1 : 0;
  }

  doSwap(a, b) { const t = this.pieces[a]; this.pieces[a] = this.pieces[b]; this.pieces[b] = t; }

  findMoves() {
    const out = [];
    for (let i = 0; i < this.n; i++) {
      if (!this.movable(i)) continue;
      const x = this.cx(i), y = this.cy(i);
      for (let k = 0; k <= 1; k++) {
        const nx = x + (k === 0 ? 1 : 0), ny = y + (k === 1 ? 1 : 0);
        if (!this.inb(nx, ny)) continue;
        const j = this.idx(nx, ny);
        if (!this.movable(j)) continue;
        const pa = this.pieces[i], pb = this.pieces[j];
        if (pa.kind === INGR && pb.kind === INGR) continue;
        if ((pa.kind === BOMB && pb.kind !== INGR) || (pb.kind === BOMB && pa.kind !== INGR)) {
          out.push({ a: i, b: j, value: (pa.kind === BOMB && pb.kind === BOMB) ? 40 : (pa.isSpecial && pb.isSpecial) ? 30 : 18 }); continue;
        }
        if (pa.isSpecial && pb.isSpecial) { out.push({ a: i, b: j, value: 22 }); continue; }
        if ((pa.kind === PROP && pb.kind === NORMAL) || (pb.kind === PROP && pa.kind === NORMAL)) { out.push({ a: i, b: j, value: 9 }); continue; }
        this.pieces[i] = pb; this.pieces[j] = pa;
        const v = this.cellValue(i) + this.cellValue(j);
        this.pieces[i] = pa; this.pieces[j] = pb;
        if (v > 0) out.push({ a: i, b: j, value: v + ((pa.isSpecial || pb.isSpecial) ? 3 : 0) });
      }
    }
    return out;
  }

  comboSwap(a, b) {
    this.reset(false);
    const res = this.res;
    const s0 = this.score;
    this.cascade = 1;
    const pa = this.pieces[a], pb = this.pieces[b];
    const bx = this.cx(b), by = this.cy(b);
    if (pa.kind === BOMB && pb.kind === BOMB) {
      this.removeAt(a, 0, 500); this.removeAt(b, 0, 500);
      res.blasts.push({ i: b, radius: 9, delay: 0, color: -1 }); res.bombCombo = true;
      for (let j = 0; j < this.n; j++) if (j !== a && j !== b) this.hitCell(j, 0.15 + this.dist(b, j) * 0.05, true);
    } else if (pa.kind === BOMB || pb.kind === BOMB) {
      const bombI = pa.kind === BOMB ? a : b;
      const otherI = bombI === a ? b : a;
      const other = this.pieces[otherI];
      const color = other.color;
      this.removeAt(bombI, 0, 300);
      const conv = (other.kind === STRIPE_H || other.kind === STRIPE_V) ? STRIPE_H : other.kind === WRAPPED ? WRAPPED : other.kind === PROP ? PROP : NORMAL;
      this.fireBomb(bombI, color, 0, conv);
    } else if (pa.kind === PROP && pb.kind === PROP) {
      this.removeAt(a, 0, 200); this.removeAt(b, 0, 200);
      this.crossHit(b, 0); this.crossHit(a, 0);
      for (let k = 0; k < 3; k++) this.launchProp(b, 0.1 + k * 0.07, k === 1 ? pa.color : pb.color, NORMAL);
    } else if (pa.kind === PROP || pb.kind === PROP) {
      const propI = pb.kind === PROP ? b : a;
      const otherI = propI === a ? b : a;
      const other = this.pieces[otherI];
      if (other.kind === NORMAL) {
        this.hitCell(propI, 0, true);
      } else {
        this.removeAt(propI, 0, 200); this.removeAt(otherI, 0, 200);
        this.crossHit(b, 0);
        this.launchProp(b, 0.12, other.color, other.kind);
      }
    } else {
      const stripes = ((pa.kind === STRIPE_H || pa.kind === STRIPE_V) ? 1 : 0) + ((pb.kind === STRIPE_H || pb.kind === STRIPE_V) ? 1 : 0);
      const wraps = (pa.kind === WRAPPED ? 1 : 0) + (pb.kind === WRAPPED ? 1 : 0);
      this.removeAt(a, 0, 200); this.removeAt(b, 0, 200);
      if (stripes === 2) {
        res.beams.push({ i: b, horizontal: true, delay: 0, color: pb.color }); res.beams.push({ i: b, horizontal: false, delay: 0, color: pa.color });
        for (let xx = 0; xx < this.w; xx++) this.hitCell(this.idx(xx, by), Math.abs(xx - bx) * 0.03, true);
        for (let yy = 0; yy < this.h; yy++) this.hitCell(this.idx(bx, yy), Math.abs(yy - by) * 0.03, true);
      } else if (stripes === 1 && wraps === 1) {
        for (let o = -1; o <= 1; o++) {
          if (this.inb(bx, by + o)) res.beams.push({ i: this.idx(bx, by + o), horizontal: true, delay: 0, color: pa.color });
          if (this.inb(bx + o, by)) res.beams.push({ i: this.idx(bx + o, by), horizontal: false, delay: 0, color: pb.color });
        }
        for (let yy = by - 1; yy <= by + 1; yy++) if (yy >= 0 && yy < this.h) for (let xx = 0; xx < this.w; xx++) this.hitCell(this.idx(xx, yy), Math.abs(xx - bx) * 0.03, true);
        for (let xx = bx - 1; xx <= bx + 1; xx++) if (xx >= 0 && xx < this.w) for (let yy = 0; yy < this.h; yy++) this.hitCell(this.idx(xx, yy), Math.abs(yy - by) * 0.03, true);
      } else {
        res.blasts.push({ i: b, radius: 3, delay: 0, color: pb.color });
        res.blasts.push({ i: b, radius: 4, delay: 0.12, color: pa.color });
        for (let yy = by - 4; yy <= by + 4; yy++) for (let xx = bx - 4; xx <= bx + 4; xx++) if (this.inb(xx, yy)) this.hitCell(this.idx(xx, yy), 0.04 + Math.max(Math.abs(xx - bx), Math.abs(yy - by)) * 0.035, true);
      }
    }
    this.processQueue();
    res.points = this.score - s0;
    res.cascade = this.cascade;
    return res;
  }

  hammer(i) {
    this.reset(true);
    const s0 = this.score;
    this.hitCell(i, 0, true);
    this.processQueue();
    this.res.points = this.score - s0;
    return this.res;
  }

  detonateAll() {
    this.reset(false);
    const s0 = this.score;
    let d = 0;
    for (let i = 0; i < this.n; i++) {
      const p = this.pieces[i]; if (!p) continue;
      if (p.isSpecial && this.open(i) && !p.primed) { this.hitCell(i, d, true); d += 0.06; }
    }
    this.processQueue();
    if (this.res.clears.length === 0 && this.res.blocks.length === 0) return null;
    this.res.points = this.score - s0;
    return this.res;
  }

  specialCount() { let c = 0; for (let i = 0; i < this.n; i++) { const p = this.pieces[i]; if (p && p.isSpecial && this.open(i)) c++; } return c; }

  randomNormalCell() {
    const c = [];
    for (let i = 0; i < this.n; i++) { const p = this.pieces[i]; if (p && p.kind === NORMAL && this.open(i)) c.push(i); }
    return c.length === 0 ? -1 : c[this.rng.nextInt(c.length)];
  }

  // ---------- Gravity ----------
  countIngr() { let c = 0; for (const p of this.pieces) if (p && p.kind === INGR) c++; return c; }

  spawnPiece() {
    if (this.ingrRemaining > 0) {
      const on = this.countIngr();
      if (on < this.ingrMaxOnBoard && this.rng.nextFloat() < (on === 0 ? 0.45 : 0.12)) { this.ingrRemaining--; return new Piece(0, INGR); }
    }
    const p = new Piece(this.rng.nextInt(this.colors), NORMAL);
    if (this.rng.nextFloat() < this.crystalChance) p.crystal = true;
    else if (this.bonusKinds.length > 0 && this.rng.nextFloat() < this.bonusChance && this.bonusesOnBoard() < this.maxBonuses) p.bonus = this.bonusKinds[this.rng.nextInt(this.bonusKinds.length)];
    return p;
  }

  verticalSource(i) {
    const x = this.cx(i); let yy = this.cy(i) - 1;
    while (yy >= 0) {
      const j = this.idx(x, yy);
      if (!this.mask[j]) { yy--; continue; }
      if (!this.open(j)) return -2;
      if (this.pieces[j] === null) return -1;
      return this.movable(j) ? j : -2;
    }
    return -3;
  }

  gravity() {
    let movedAny = false;
    const spawned = new Int32Array(this.w);
    let guard = 0;
    while (guard++ < 400) {
      let changed = false;
      for (let y = this.h - 1; y >= 0; y--) for (let x = 0; x < this.w; x++) {
        const i = this.idx(x, y);
        if (!this.open(i) || this.pieces[i] !== null) continue;
        const s = this.verticalSource(i);
        if (s >= 0) {
          const p = this.pieces[s]; this.pieces[s] = null; this.pieces[i] = p; this.addPath(p, i); changed = true;
        } else if (s === -3) {
          const p = this.spawnPiece();
          p.vx = x; p.vy = y - 1 - spawned[x];
          spawned[x]++;
          this.pieces[i] = p; this.addPath(p, i); changed = true;
        }
      }
      if (!changed) {
        outer:
        for (let y = this.h - 1; y >= 1; y--) for (let x = 0; x < this.w; x++) {
          const i = this.idx(x, y);
          if (!this.open(i) || this.pieces[i] !== null) continue;
          if (this.verticalSource(i) !== -2) continue;
          const dirs = this.rng.nextBoolean() ? [-1, 1] : [1, -1];
          for (const dx of dirs) {
            const sx = x + dx;
            if (!this.inb(sx, y - 1)) continue;
            const s = this.idx(sx, y - 1);
            if (!this.movable(s)) continue;
            const below = this.idx(sx, y);
            if (this.open(below) && this.pieces[below] === null) continue;
            const p = this.pieces[s]; this.pieces[s] = null; this.pieces[i] = p; this.addPath(p, i);
            changed = true;
            break outer;
          }
        }
      }
      if (!changed) break;
      movedAny = true;
    }
    return movedAny;
  }

  // ---------- Shuffle ----------
  shuffle() {
    const cells = [];
    for (let i = 0; i < this.n; i++) if (this.movable(i) && this.pieces[i].kind !== INGR) cells.push(i);
    if (cells.length === 0) return false;
    const ps = cells.map(i => this.pieces[i]);
    for (let attempt = 0; attempt < 300; attempt++) {
      const perm = this.rng.shuffled(ps);
      for (let k = 0; k < cells.length; k++) this.pieces[cells[k]] = perm[k];
      if (attempt > 120) for (let k = 0; k < cells.length; k++) { const p = this.pieces[cells[k]]; if (p.kind === NORMAL) p.color = this.rng.nextInt(this.colors); }
      if (this.findGroups().length === 0 && this.findMoves().length > 0) {
        for (let k = 0; k < cells.length; k++) this.addPath(this.pieces[cells[k]], cells[k]);
        return true;
      }
    }
    for (let k = 0; k < cells.length; k++) this.addPath(this.pieces[cells[k]], cells[k]);
    return false;
  }

  spreadChoc() {
    if (this.chocBroken) { this.chocBroken = false; return -1; }
    const cands = [];
    for (let i = 0; i < this.n; i++) {
      if (!this.choc[i]) continue;
      for (let k = 0; k < 4; k++) {
        const nx = this.cx(i) + DX[k], ny = this.cy(i) + DY[k];
        if (!this.inb(nx, ny)) continue;
        const j = this.idx(nx, ny);
        const p = this.pieces[j];
        if (this.open(j) && p && p.kind === NORMAL && !this.lock[j]) cands.push(j);
      }
    }
    if (cands.length === 0) return -1;
    const j = cands[this.rng.nextInt(cands.length)];
    this.pieces[j] = null; this.choc[j] = true;
    return j;
  }

  jellyLeft() { let s = 0; for (const v of this.jelly) s += v; return s; }
}

// ---- levelgen.js ----
// ===================== levels, generator, tuning bot, meta (ports of LevelGen.kt / Meta.kt) =====================

const G_SCORE = 0, G_JELLY = 1, G_INGR = 2, G_COLLECT = 3, G_ORGAN = 4;
const F_JELLY = 0, F_COLLECT = 1, F_INGR = 2, F_ICE = 3, F_LOCK = 4, F_CHOC = 5, F_ICE2 = 6, F_SPECIALS = 7,
  F_BOX = 8, F_ORGAN = 9, F_PAL = 10, F_CAB = 11;

const MODE_CAMPAIGN = 0, MODE_BONUS = 1, MODE_ENDLESS = 2, MODE_ARCADE = 3;

class LevelSpec {
  constructor(num) {
    this.num = num;
    this.w = 9; this.h = 9; this.colors = 5;
    this.alloc(81);
    this.organGoal = 0;
    this.goal = G_SCORE; this.target = 0;
    this.ingrTotal = 0; this.ingrCols = [];
    this.collectColors = []; this.collectCounts = [];
    this.hard = false; this.intro = -1; this.tuned = false;
    this.crystalGoal = 10; this.par = 20;
    this.crystalChance = 0.065;
    this.bonusKinds = []; this.bonusChance = 0.025;
    this.bonusPower = new Array(BN_COUNT).fill(1);
    this.bonusLevel = -1; this.maxBonuses = 3;
  }
  alloc(n) {
    this.mask = new Array(n).fill(true); this.jelly = new Array(n).fill(0); this.ice = new Array(n).fill(0);
    this.choc = new Array(n).fill(false); this.lock = new Array(n).fill(false);
    this.blk = new Array(n).fill(0); this.blkHp = new Array(n).fill(0);
  }
  build(rng) {
    const w = this.w, h = this.h;
    const b = new Board(w, h, this.colors, rng);
    b.crystalChance = this.crystalChance;
    b.bonusKinds = this.bonusKinds;
    b.bonusChance = this.bonusChance;
    b.maxBonuses = this.maxBonuses;
    for (let k = 0; k < BN_COUNT; k++) b.bonusPower[k] = this.bonusPower[k];
    for (let i = 0; i < w * h; i++) {
      b.mask[i] = this.mask[i]; b.jelly[i] = this.mask[i] ? this.jelly[i] : 0;
      b.ice[i] = this.mask[i] ? this.ice[i] : 0;
      b.choc[i] = this.mask[i] && this.choc[i];
      b.blk[i] = this.mask[i] ? this.blk[i] : 0;
      b.blkHp[i] = this.blkHp[i];
      b.lock[i] = this.mask[i] && this.lock[i] && this.ice[i] === 0 && !this.choc[i] && b.blk[i] === 0;
    }
    for (let i = 0; i < w * h; i++) if (b.blk[i] === BK_CAB && b.cabAnchor[i] < 0) {
      for (const j of [i, i + 1, i + w, i + w + 1]) b.cabAnchor[j] = i;
      b.blkHp[i] = 8;
    }
    b.organGoal = this.organGoal;
    let placed = 0;
    for (const c of this.ingrCols) {
      for (let y = 0; y < h; y++) {
        const i = b.idx(c, y);
        if (b.open(i)) { if (b.pieces[i] === null) { const p = new Piece(0, INGR); p.vx = c; p.vy = y; b.pieces[i] = p; b.lock[i] = false; placed++; } break; }
        if (b.mask[i]) break;
      }
    }
    for (let k = 0; k < this.collectColors.length; k++) b.collectNeed[this.collectColors[k]] = this.collectCounts[k];
    b.ingrGoal = this.goal === G_INGR;
    b.ingrRemaining = Math.max(0, this.ingrTotal - placed);
    b.ingrMaxOnBoard = this.ingrTotal >= 3 ? 2 : 1;
    b.fillInitial();
    return b;
  }
  secondaryDone(b) {
    switch (this.goal) {
      case G_SCORE: return true;
      case G_JELLY: return b.jellyLeft() === 0;
      case G_INGR: return b.ingrCollected >= this.ingrTotal;
      case G_ORGAN: return b.organNotes >= this.organGoal;
      default: return this.collectColors.every((c, k) => b.collected[c] >= this.collectCounts[k]);
    }
  }
  goalDone(b) { return b.crystalsCollected >= this.crystalGoal && this.secondaryDone(b); }
  par3() { return Math.floor(this.par * 1.15) + 2; }
  par2() { return Math.floor(this.par * 1.7) + 4; }
  encodeTune() { return String(this.par); }
  decodeTune(s) { const v = parseInt(String(s).trim(), 10); if (isNaN(v)) return false; this.par = v; this.tuned = true; return true; }
}

const LevelGen = {
  plain(num) {
    const s = new LevelSpec(num);
    s.w = 9; s.h = 9; s.alloc(81);
    s.colors = 5; s.goal = G_SCORE; s.crystalGoal = 1000000; s.tuned = true;
    return s;
  },
  modeSpec(mode, maxLevel) {
    const s = this.plain(900);
    if (mode === MODE_ENDLESS) s.crystalChance = 0.08;
    else { s.crystalChance = 0.12; if (maxLevel > 30) s.colors = 6; }
    return s;
  },
  bonusSpec(stage) { const s = this.plain(901); s.bonusLevel = stage % 3; return s; },
  introFor(n) {
    return ({ 2: F_JELLY, 3: F_COLLECT, 4: F_INGR, 5: F_SPECIALS, 6: F_ICE, 11: F_LOCK, 13: F_BOX, 16: F_CHOC, 19: F_ORGAN, 25: F_ICE2, 27: F_PAL, 35: F_CAB })[n] ?? -1;
  },
  sym(s, x, y, f) { f(y * s.w + x); f(y * s.w + (s.w - 1 - x)); },
  shape(s, k, r) {
    const w = s.w, h = s.h;
    const m = new Array(w * h).fill(true);
    const off = (x, y) => { if (x >= 0 && x < w && y >= 0 && y < h) { m[y * w + x] = false; m[y * w + (w - 1 - x)] = false; } };
    switch (k) {
      case 1: off(0, 0); off(0, h - 1); break;
      case 2: for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (Math.abs(x - ((w / 2) | 0)) + Math.abs(y - ((h / 2) | 0)) > (((w / 2) | 0) + 2)) m[y * w + x] = false; break;
      case 3: off(0, 3); off(0, 4); off(0, 5); off(1, 4); break;
      case 4: for (const y of [0, 1, h - 2, h - 1]) { off(0, y); off(1, y); } break;
      case 5: off((w / 2) | 0, 0); off((w / 2) | 0, 1); off((w / 2) | 0, h - 1); break;
      case 6: { const cx = (w / 2) | 0, cy = (h / 2) | 0; off(cx, cy); off(cx - 1, cy); off(cx, cy - 1); off(cx, cy + 1); break; }
      case 7: off(0, 0); off(1, 0); off(0, 1); off((w / 2) | 0, (h / 2) | 0); break;
      case 8: for (let y = 3; y <= 5; y++) off((w / 2) | 0, y); break;
    }
    if (k >= 3 && r.nextFloat() < 0.3) off(r.nextInt(2, ((w / 2) | 0) + 1), r.nextInt(2, h - 2));
    s.mask = m;
  },
  jellyPattern(s, k, r, dbl) {
    const w = s.w, h = s.h, hw = (w / 2) | 0, hh = (h / 2) | 0;
    const j = new Array(w * h).fill(0);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (!s.mask[i]) continue;
      let on = false;
      switch (k) {
        case 0: on = true; break;
        case 1: on = x >= 1 && x < w - 1 && y >= 2 && y < h - 1; break;
        case 2: on = y >= hh - 1; break;
        case 3: on = (x + y) % 2 === 0 || y >= h - 2; break;
        case 4: on = x <= 1 || x >= w - 2 || y >= h - 2; break;
        case 5: on = Math.abs(x - hw) <= 1 || Math.abs(y - hh) <= 1; break;
      }
      if (on) j[i] = 1;
    }
    if (k >= 6) for (let y = 0; y < h; y++) for (let x = 0; x <= hw; x++) if (r.nextFloat() < 0.55) this.sym(s, x, y, (it) => { if (s.mask[it]) j[it] = 1; });
    if (dbl) for (let y = hh; y < h; y++) for (let x = 0; x < w; x++) { const i = y * w + x; if (j[i] > 0 && (x + y) % 2 === 1) j[i] = 2; }
    s.jelly = j;
  },
  generate(n) {
    const r = new Rng(n * 7919 + 31);
    const s = new LevelSpec(n);
    s.intro = this.introFor(n);
    s.hard = n >= 10 && n % 10 === 0;
    if (n === 1) { s.w = 7; s.h = 7; } else if (n <= 4) { s.w = 8; s.h = 8; } else { s.w = 9; s.h = 9; }
    s.alloc(s.w * s.h);
    if (n > 5) this.shape(s, r.nextInt(9), r);
    s.colors = n <= 3 ? 4 : (n > 30 && r.nextFloat() < 0.2) ? 6 : 5;
    if (n === 1 || n === 5) s.goal = G_SCORE;
    else if (n === 2) s.goal = G_JELLY;
    else if (n === 3) s.goal = G_COLLECT;
    else if (n === 4) s.goal = G_INGR;
    else if (n === 6 || n === 11) s.goal = G_JELLY;
    else if (n === 13 || n === 16 || n === 27 || n === 35) s.goal = G_SCORE;
    else if (n === 19) s.goal = G_ORGAN;
    else {
      const v = r.nextFloat();
      s.goal = v < 0.27 ? G_JELLY : v < 0.41 ? G_INGR : v < 0.55 ? G_COLLECT : (v < 0.67 && n > 19) ? G_ORGAN : G_SCORE;
    }
    const baseCr = Math.min(10 + Math.floor(n * 1.6), 40);
    s.crystalGoal = s.goal === G_SCORE ? baseCr : Math.max(6, Math.floor(baseCr * 0.55));
    const isIntro = s.intro >= 0;
    const useIce = n >= 6 && (n === 6 || n === 25 || (!isIntro && r.nextFloat() < 0.55));
    const useLock = n >= 11 && (n === 11 || (!isIntro && r.nextFloat() < 0.4));
    const useChoc = n >= 16 && (n === 16 || (!isIntro && r.nextFloat() < 0.3));
    const w = s.w, h = s.h, hw = (w / 2) | 0;
    if (useIce) {
      const hp2 = n >= 25 && (n === 25 || r.nextFloat() < 0.45);
      const frac = Math.min(0.08 + n * 0.003, 0.26);
      const count = Math.max(2, Math.round((w * h) * frac / 2));
      const bar = n > 12 && r.nextFloat() < 0.35;
      if (bar) {
        const y = r.nextInt((h / 2) | 0, h - 1);
        for (let x = 0; x < w; x++) if (s.mask[y * w + x] && x !== 1 && x !== w - 2 && x !== hw) s.ice[y * w + x] = hp2 ? 2 : 1;
      } else {
        let placed = 0, guard = 0;
        while (placed < count && guard++ < 200) {
          const x = r.nextInt(0, hw + 1), y = r.nextInt(2, h);
          const i = y * w + x;
          if (!s.mask[i] || s.ice[i] > 0) continue;
          const hp = (hp2 && r.nextBoolean()) ? 2 : 1;
          this.sym(s, x, y, (it) => { s.ice[it] = hp; });
          placed++;
        }
      }
    }
    if (useChoc) {
      const c = n === 16 ? 2 : r.nextInt(1, 3);
      for (let k = 0; k < c; k++) this.sym(s, k, h - 1, (it) => { if (s.mask[it]) { s.choc[it] = true; s.ice[it] = 0; } });
    }
    if (useLock) {
      const count = r.nextInt(3, 7);
      let placed = 0, guard = 0;
      while (placed < count && guard++ < 200) {
        const x = r.nextInt(0, hw + 1), y = r.nextInt(1, h);
        const i = y * w + x;
        if (!s.mask[i] || s.ice[i] > 0 || s.choc[i] || s.lock[i]) continue;
        this.sym(s, x, y, (it) => { s.lock[it] = true; });
        placed++;
      }
    }
    this.placeBlockers(s, n, r, isIntro);
    if (n >= 13 && isIntro) s.crystalGoal = Math.max(8, Math.floor(s.crystalGoal * 0.6));
    if (s.goal === G_JELLY) this.jellyPattern(s, n === 2 ? 1 : r.nextInt(7), r, n >= 20 && r.nextFloat() < 0.45);
    else if (s.goal === G_INGR) {
      s.ingrTotal = Math.min(2 + ((n / 25) | 0), 4) + (n === 4 ? -1 : 0);
      const cols = s.ingrTotal >= 3 ? [r.nextInt(1, hw), r.nextInt(hw + 1, w - 1)] : [r.nextInt(2, w - 2)];
      s.ingrCols = cols.filter(c => { if (s.mask[c]) return true; for (let y = 1; y < h; y++) if (s.mask[y * w + c]) return true; return false; });
      for (let i = 0; i < w * h; i++) if (s.choc[i]) s.choc[i] = false;
    } else if (s.goal === G_COLLECT) {
      const k = (n > 30 && r.nextFloat() < 0.4) ? 3 : 2;
      const all = []; for (let c = 0; c < s.colors; c++) all.push(c);
      s.collectColors = r.shuffled(all).slice(0, k).sort((a, b) => a - b);
      const base = Math.min(14 + ((n / 2) | 0), 45);
      s.collectCounts = []; for (let q = 0; q < k; q++) s.collectCounts.push((Math.max(10, base + r.nextInt(-3, 6)) / 5 | 0) * 5);
    }
    return s;
  },
  free(s, i) { return s.mask[i] && s.ice[i] === 0 && !s.choc[i] && !s.lock[i] && s.blk[i] === 0; },
  placeBlockers(s, n, r, isIntro) {
    const w = s.w, h = s.h, hw = (w / 2) | 0;
    s.blk = new Array(w * h).fill(0); s.blkHp = new Array(w * h).fill(0);
    const useBox = n >= 13 && (n === 13 || (!isIntro && r.nextFloat() < 0.4));
    const useOrgan = s.goal === G_ORGAN;
    const usePal = n >= 27 && (n === 27 || (!isIntro && r.nextFloat() < 0.3));
    const useCab = n >= 35 && (n === 35 || (!isIntro && r.nextFloat() < 0.25));
    if (useCab) {
      for (let attempt = 0; attempt < 30; attempt++) {
        const x = w % 2 === 1 ? hw - 1 + r.nextInt(2) : hw - 1, y = r.nextInt(3, h - 3);
        const cells = [y * w + x, y * w + x + 1, (y + 1) * w + x, (y + 1) * w + x + 1];
        if (cells.every(c => this.free(s, c))) { for (const c of cells) s.blk[c] = BK_CAB; break; }
      }
    }
    if (useOrgan) {
      const y = r.nextInt(3, h - 3);
      const xs = r.nextBoolean() ? [hw] : [2, w - 3];
      for (const x of xs) { const i = y * w + x; if (this.free(s, i)) s.blk[i] = BK_ORGAN; }
      if (!s.blk.some(v => v === BK_ORGAN)) for (let i = w * 3; i < w * h; i++) if (this.free(s, i)) { s.blk[i] = BK_ORGAN; break; }
      s.organGoal = Math.min(10 + ((n / 8) | 0), 26);
    }
    if (useBox) {
      const count = n === 13 ? 4 : r.nextInt(2, 5);
      const multi = n >= 21;
      let placed = 0, guard = 0;
      while (placed < count && guard++ < 200) {
        const x = r.nextInt(0, hw + 1), y = r.nextInt(2, h - 1);
        const i = y * w + x, j = y * w + (w - 1 - x);
        if (!this.free(s, i) || !this.free(s, j)) continue;
        const hp = multi ? r.nextInt(1, 4) : 1;
        for (const c of [i, j]) { s.blk[c] = BK_BOX; s.blkHp[c] = hp; }
        placed++;
      }
    }
    if (usePal) {
      const count = n === 27 ? 2 : r.nextInt(1, 3);
      let placed = 0, guard = 0;
      while (placed < count && guard++ < 200) {
        const x = r.nextInt(1, hw), y = r.nextInt(2, h - 2);
        const i = y * w + x, j = y * w + (w - 1 - x);
        if (!this.free(s, i) || !this.free(s, j)) continue;
        s.blk[i] = BK_PAL; s.blk[j] = BK_PAL; placed++;
      }
    }
  },
  pickMove(s, b, moves, r) {
    let best = moves[0], bv = -1e9;
    const ingr = [];
    if (s.goal === G_INGR) for (let i = 0; i < b.n; i++) { const p = b.pieces[i]; if (p && p.kind === INGR) ingr.push([b.cx(i), b.cy(i)]); }
    for (const m of moves) {
      let v = m.value + r.nextFloat() * 3 + b.cy(m.a) * 0.07;
      for (const c of [m.a, m.b]) {
        const x = b.cx(c), y = b.cy(c);
        for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (b.inb(xx, yy)) { const q = b.pieces[b.idx(xx, yy)]; if (q && q.crystal) v += 0.8; }
      }
      if (s.goal === G_JELLY) {
        for (const c of [m.a, m.b]) { const x = b.cx(c), y = b.cy(c); for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (b.inb(xx, yy)) v += b.jelly[b.idx(xx, yy)] * 0.6; }
      } else if (s.goal === G_INGR) {
        for (const [ix, iy] of ingr) for (const c of [m.a, m.b]) if (b.cx(c) === ix && b.cy(c) > iy) v += 5 + b.cy(c) * 0.4;
      } else if (s.goal === G_ORGAN) {
        for (const c of [m.a, m.b]) { const x = b.cx(c), y = b.cy(c); for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (b.inb(xx, yy) && b.blk[b.idx(xx, yy)] === BK_ORGAN) v += 3; }
      } else if (s.goal === G_COLLECT) {
        const pa = b.pieces[m.a], pb = b.pieces[m.b];
        if (pa && s.collectColors.includes(pa.color)) v += 2;
        if (pb && s.collectColors.includes(pb.color)) v += 2;
      }
      if (v > bv) { bv = v; best = m; }
    }
    return best;
  },
  simulate(s, seed, maxMoves, stopAtGoal) {
    const r = new Rng(seed);
    const b = s.build(new Rng(seed * 31 + 7));
    b.sim = true;
    for (let m = 1; m <= maxMoves; m++) {
      let moves = b.findMoves();
      if (moves.length === 0) { b.shuffle(); moves = b.findMoves(); if (moves.length === 0) return [-1, b.score]; }
      const mv = this.pickMove(s, b, moves, r);
      const kind = b.swapKind(mv.a, mv.b);
      if (kind === 0) continue;
      b.doSwap(mv.a, mv.b);
      b.beginTurn();
      if (kind === 2) b.comboSwap(mv.a, mv.b); else b.clearPhase([mv.b, mv.a]);
      let g = 0;
      while (g++ < 80) { b.gravity(); if (!b.clearPhase(null)) break; }
      b.spreadChoc();
      if (stopAtGoal && s.goalDone(b)) return [m, b.score];
    }
    return [(!stopAtGoal || s.goalDone(b)) ? maxMoves : -1, b.score];
  },
  /** Same as tune() but spread over timer slices so the UI stays responsive. */
  tuneAsync(s, done) {
    const n = s.num, k = 12, cap = 170, used = [];
    let it = 0;
    const step = () => {
      const t0 = Date.now();
      while (it < k && Date.now() - t0 < 14) { const r = this.simulate(s, n * 1000 + it, cap, true); used.push(r[0] < 0 ? cap : r[0]); it++; }
      if (it < k) { setTimeout(step, 0); return; }
      used.sort((a, b) => a - b);
      s.par = Math.max(3, Math.round(used[(k / 2) | 0] * (s.hard ? 1.1 : 1)));
      s.tuned = true; done();
    };
    setTimeout(step, 0);
  },
  tune(s) {
    const n = s.num, k = 12, cap = 170;
    const used = [];
    for (let it = 0; it < k; it++) { const r = this.simulate(s, n * 1000 + it, cap, true); used.push(r[0] < 0 ? cap : r[0]); }
    used.sort((a, b) => a - b);
    s.par = Math.max(3, Math.round(used[(k / 2) | 0] * (s.hard ? 1.1 : 1)));
    s.tuned = true;
  },
};

// ===================== canvas helpers, palette, UI primitives (ports of Ui.kt / Pal) =====================

const PI = Math.PI;
function css(argb, alphaMul) {
  const a = ((argb >>> 24) & 255) / 255 * (alphaMul === undefined ? 1 : alphaMul);
  return `rgba(${(argb >>> 16) & 255},${(argb >>> 8) & 255},${argb & 255},${a.toFixed(3)})`;
}
function withA(argb, a255) { return (((a255 & 255) << 24) | (argb & 0xFFFFFF)) >>> 0; }

class R {
  constructor(l, t, r, b) { this.l = l; this.t = t; this.r = r; this.b = b; }
  set(l, t, r, b) { this.l = l; this.t = t; this.r = r; this.b = b; return this; }
  get w() { return this.r - this.l; }
  get h() { return this.b - this.t; }
  get cx() { return (this.l + this.r) / 2; }
  get cy() { return (this.t + this.b) / 2; }
  contains(x, y) { return x >= this.l && x <= this.r && y >= this.t && y <= this.b; }
  copy() { return new R(this.l, this.t, this.r, this.b); }
  inset(dx, dy) { this.l += dx; this.r -= dx; this.t += dy; this.b -= dy; return this; }
}

function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

// ---- paths ----
function rrectPath(p, l, t, r, b, rad) {

class SpriteSet {

    this.icon = []; for (let c = 0; c < 6; c++) this.icon[c] = Sprites.makePiece(c, NORMAL, Math.max(16, Math.floor(s * 0.7)));
    this.bomb = Sprites.makeBomb(s); this.ingr = Sprites.makeBell(s);
    this.ice1 = Sprites.makeIce(s, 1); this.ice2 = Sprites.makeIce(s, 2);
    this.choc = Sprites.makeChoc(s); this.lock = Sprites.makeLock(s);
    this.noteP = Sprites.makeNoteParticle(Math.max(12, Math.floor(s * 0.45)));
    this.spark = Sprites.makeSpark(Math.max(12, Math.floor(s * 0.5)));
    this.glow = Sprites.makeGlow(s * 2);
    this.crystal = Icons.crystal(Math.max(10, Math.floor(s * 0.44)));
    this.crystalBig = Icons.crystal(Math.max(14, Math.floor(s * 0.8)));
    this.badge = []; for (let k = 1; k < BN_COUNT; k++) this.badge[k] = Icons.bonusBadge(k, Math.max(12, Math.floor(s * 0.46)));
    const ts = Math.max(24, Math.floor(s * 1.05));
    this.totem = []; this.totemLocked = [];
    for (let c = 0; c < 6; c++) { this.totem[c] = Icons.totem(c, ts, false); this.totemLocked[c] = Icons.totem(c, ts, true); }
    this.box = []; for (let k = 1; k <= 3; k++) this.box[k] = Icons.box(s, k);
    this.organ = Icons.organ(s); this.organNote = Sprites.makeNoteParticle(Math.max(12, Math.floor(s * 0.5)));

    if (p.kind === BOMB) return this.bomb;

class Fx {
  constructor(g) {
    this.g = g; this.parts = []; this.pool = []; this.texts = []; this.beams = []; this.rings = []; this.bolts = []; this.sched = [];
    this.shake = 0;
  }
  clear() { this.parts = []; this.texts = []; this.beams = []; this.rings = []; this.bolts = []; this.sched = []; this.shake = 0; }
  at(delay, f) { if (delay <= 0) f(); else this.sched.push({ t: delay, f }); }
  obtain() { return this.pool.length ? this.pool.pop() : {}; }
  burst(x, y, color, count, speed, size) {
    for (let i = 0; i < count; i++) {
      if (this.parts.length > 900) return;
      const p = this.obtain();
      const a = Math.random() * 2 * PI, s = speed * (0.35 + Math.random() * 0.8);
      p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - speed * 0.25;
      p.max = 0.45 + Math.random() * 0.45; p.life = p.max;
      p.size = size * (0.5 + Math.random() * 0.8); p.color = color;
      p.type = Math.random() < 0.35 ? 1 : 0;

      this.parts.push(p);
    }
  }
  notes(x, y, color, count, speed, size) {
    for (let i = 0; i < count; i++) {
      if (this.parts.length > 900) return;
      const p = this.obtain();
      p.x = x + (Math.random() - 0.5) * size; p.y = y;
      p.vx = (Math.random() - 0.5) * speed; p.vy = -speed * (0.6 + Math.random() * 0.7);
      p.max = 0.8 + Math.random() * 0.5; p.life = p.max;
      p.size = size * (0.6 + Math.random() * 0.5); p.color = color; p.type = 2;
      p.rot = (Math.random() - 0.5) * 40; p.vr = (Math.random() - 0.5) * 90; p.grav = -speed * 0.2;
      this.parts.push(p);
    }
  }
  sparkle(x, y, color, count, spread, size) {
    for (let i = 0; i < count; i++) {
      if (this.parts.length > 900) return;
      const p = this.obtain();
      p.x = x + (Math.random() - 0.5) * spread; p.y = y + (Math.random() - 0.5) * spread;
      p.vx = (Math.random() - 0.5) * spread * 0.6; p.vy = (Math.random() - 0.5) * spread * 0.6;
      p.max = 0.4 + Math.random() * 0.5; p.life = p.max;
      p.size = size * (0.5 + Math.random()); p.color = color; p.type = 3; p.grav = 0; p.rot = 0; p.vr = 0;

  ring(x, y, maxR, color) { this.rings.push({ x, y, maxR, color, life: 0.45 }); }
  bolt(x1, y1, x2, y2, color) { this.bolts.push({ x1, y1, x2, y2, color, life: 0.3 }); }

  update(dt) {
    if (this.sched.length) {

  note(colorIdx, cascade, vol = 0.8) {
    if (!this.prog.sound) return;
    const i = clamp(colorIdx + Math.max(0, cascade - 1) * 2, 0, 14);
    this.fire(this.notes[i], vol, 1);
  }
  noteRaw(i, vol = 0.7) { if (this.prog.sound) this.fire(this.notes[clamp(i, 0, 14)], vol, 1); }
  play(name, vol = 0.8, rate = 1) {
    if (!this.prog.sound) return;
    const now = performance.now();
    if (this.lastPlay[name] && now - this.lastPlay[name] < 25) return; // avoid stacking identical sounds in one frame
    this.lastPlay[name] = now;
    this.fire(this.bufs[name], vol, rate);
  }
  startMusic() {
    if (!this.ctx || !this.music) return;
    if (!this.musicSrc) {
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0; this.musicGain.connect(this.master);
      const s = this.ctx.createBufferSource(); s.buffer = this.music; s.loop = true; s.connect(this.musicGain); s.start();
      this.musicSrc = s;
    }
    this.applyMusic();
  }
  applyMusic() {
    if (!this.musicGain) return;
    const want = this.musicWanted && this.prog.music, t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, t);
    this.musicGain.gain.linearRampToValueAtTime(want ? 0.5 : 0, t + (want ? 0.5 : 0.2));
  }
  resumeMusic() { this.musicWanted = true; if (this.ready) this.startMusic(); }
  pauseMusic() { this.musicWanted = false; this.applyMusic(); }
  suspend() { if (this.ctx) try { this.ctx.suspend(); } catch (e) {} }
  resume() { if (this.ctx) try { this.ctx.resume(); } catch (e) {} }
}

/** Looks up / computes par for a level; precomputed table first, then cache, then async bot. */
function ensureTuned(g, spec, done) {
  const n = spec.num;
  if (typeof PAR_TABLE !== 'undefined' && PAR_TABLE[n]) { spec.par = PAR_TABLE[n]; spec.tuned = true; done(); return; }
  const cached = g.prog.tuned(n);
  if (cached !== null && spec.decodeTune(cached)) { done(); return; }
  LevelGen.tuneAsync(spec, () => { g.prog.saveTuned(n, spec.encodeTune()); done(); });
}

class MapScene {
  constructor(g, autoOpen, bonusStage = -1) {
    this.g = g; this.prog = g.prog; this.autoOpen = autoOpen; this.bonusStage = bonusStage;
    this.spacing = 100; this.nodeR = 30; this.camY = 0; this.vel = 0; this.camTarget = NaN;
    this.downX = 0; this.downY = 0; this.lastY = 0; this.lastT = 0; this.dragging = false; this.moved = false;
    this.popup = null; this.btns = new BtnSet(g); this.autoPending = false;
  }
  get anchor() { return this.g.H * 0.6; }
  nodeX(i) { return this.g.W / 2 + Math.sin(i * 0.9) * this.g.W * 0.26; }
  nodeWY(i) { return -(i - 1) * this.spacing; }
  sy(i) { return this.nodeWY(i) - this.camY + this.anchor; }
  get camMax() { return this.anchor - this.g.H * 0.74; }
  get camMin() { return this.nodeWY(this.prog.maxLevel + 25); }

  layout() {
    const g = this.g, prog = this.prog;
    this.spacing = g.H * 0.112; this.nodeR = g.W * 0.072;
    const focus = this.bonusStage >= 0 ? (this.bonusStage + 1) * Meta.STAGE_LEN : this.autoOpen > 1 ? this.autoOpen - 1 : prog.maxLevel;
    this.camY = clamp(this.nodeWY(focus), this.camMin, this.camMax);
    if (this.autoOpen > 0) { this.camTarget = clamp(this.nodeWY(this.autoOpen), this.camMin, this.camMax); this.autoPending = true; }
    this.btns.clear();
    const hs = 46 * g.dp, top = g.safeTop + 8 * g.dp;
    this.giftBtn = this.btns.add(new Btn(new R(g.W - hs * 2.3, top, g.W - hs * 1.3, top + hs), '', 0xFFFFC94A, 0xFFB36B00, () => { this.popup = new DailyPopup(this); }));
    this.giftBtn.icon = (c, r) => Ui.gift(c, r.cx, r.cy + r.h * 0.04, r.h * 0.32);
    const gear = this.btns.add(new Btn(new R(g.W - hs * 1.15, top, g.W - hs * 0.15, top + hs), '', 0xFF6B6B7A, 0xFF2B2B35, () => { this.popup = new SettingsPopup(this); }));
    gear.icon = (c, r) => Ui.gear(c, r.cx, r.cy, r.h * 0.3);
    const bh = 44 * g.dp, by = g.H - g.safeBottom - bh - 12 * g.dp, bw = g.W * 0.42;
    const shop = this.btns.add(new Btn(new R(g.W * 0.05, by, g.W * 0.05 + bw, by + bh), 'Мастерская', 0xFFE9A062, 0xFF9A5426, () => g.go(new ShopScene(g, -1))));
    shop.textSize = bh * 0.4;
    const modes = this.btns.add(new Btn(new R(g.W * 0.95 - bw, by, g.W * 0.95, by + bh), 'Режимы', 0xFF6B8FC0, 0xFF2B4A78, () => { this.popup = new ModesPopup(this); }));
    modes.textSize = bh * 0.4;
    if (this.popup) { /* keep popup across relayout (rotation / resize) */ }
    else if (this.bonusStage >= 0) this.popup = new BonusPopup(this, this.bonusStage);
    else if (prog.dailyAvailable() && this.autoOpen < 0 && prog.maxLevel > 1) this.popup = new DailyPopup(this);
  }

  update(dt) {
    const g = this.g;
    g.fx.update(dt);
    this.giftBtn.visible = this.prog.dailyAvailable();
    if (!isNaN(this.camTarget)) {
      this.camY += (this.camTarget - this.camY) * Math.min(1, dt * 4);
      if (Math.abs(this.camTarget - this.camY) < 2) {
        this.camY = this.camTarget; this.camTarget = NaN;
        if (this.autoPending) { this.autoPending = false; if (this.autoOpen <= this.prog.maxLevel) this.popup = new IntroPopup(this, this.autoOpen); }
      }
    } else if (!this.dragging && Math.abs(this.vel) > 1) {
      this.camY -= this.vel * dt; this.vel *= (1 - Math.min(1, dt * 3.5));
    }
    const c0 = this.camY;
    this.camY = clamp(this.camY, this.camMin, this.camMax);
    if (c0 !== this.camY) this.vel = 0;
    if (this.popup) this.popup.update(dt);
  }

  draw(c) {
    const g = this.g, prog = this.prog;
    g.drawBackground(c, this.camY * 0.35, 0);
    const m = this.nodeR * 3;
    const from = Math.max(1, Math.floor(1 + (this.anchor - this.camY - g.H - m) / this.spacing));
    const to = Math.max(from, Math.ceil(1 + (this.anchor - this.camY + m) / this.spacing));
    const logoY = this.sy(1) + this.spacing * 1.25;
    if (logoY < g.H + 200 && logoY > -200) {
      Ui.gradTxt(c, 'Симфония', g.W / 2, logoY - g.W * 0.06, g.W * 0.13, 0xFFFFFFFF, 0xFFD9434B, 0xFF2B211C);
      Ui.gradTxt(c, 'трёх', g.W / 2, logoY + g.W * 0.08, g.W * 0.11, 0xFFFFF1B0, 0xFFFFA800, 0xFF2B211C);
    }
    for (let i = from; i <= to; i++) {
      const x1 = this.nodeX(i), y1 = this.sy(i), x2 = this.nodeX(i + 1), y2 = this.sy(i + 1);
      c.fillStyle = css(i < prog.maxLevel ? 0xFFE98638 : 0x552B211C);
      for (let k = 1; k <= 4; k++) {
        const t = k / 5, x = x1 + (x2 - x1) * t + Math.sin(t * PI) * g.W * 0.03, y = y1 + (y2 - y1) * t;
        c.fill(circlePath(x, y, this.nodeR * 0.12));
      }
    }
    for (let i = from; i <= to; i++) this.drawNode(c, i);
    for (let st = Math.max(0, Math.floor((from - 2) / Meta.STAGE_LEN)); st <= Math.floor(to / Meta.STAGE_LEN) + 1; st++) this.drawStage(c, st);
    const hb = g.safeTop + 70 * g.dp;
    c.fillStyle = linGrad(c, 0, 0, 0, hb, [0xCCF7F3EA, 0x00F7F3EA]); c.fillRect(0, 0, g.W, hb);
    const bb = g.H - g.safeBottom - 70 * g.dp;
    c.fillStyle = linGrad(c, 0, bb, 0, g.H, [0x00F7F3EA, 0xCCF7F3EA]); c.fillRect(0, bb, g.W, g.H - bb);
    this.drawHeader(c);
    this.btns.draw(c);
    if (!prog.modesOpen) { const mb = this.btns.list[this.btns.list.length - 1]; fillP(c, rrect(mb.r.l, mb.r.t, mb.r.r, mb.r.b, mb.r.h / 2), css(0x99F7F3EA)); }
    if (prog.wallet >= 4) {
      const sb = this.btns.list[this.btns.list.length - 2], pulse = 1 + 0.12 * Math.sin(g.time * 5);
      fillP(c, circlePath(sb.r.r - 8 * g.dp, sb.r.t + 6 * g.dp, 7 * g.dp * pulse), css(0xFFD9434B));
    }
    if (this.giftBtn.visible) {
      const pulse = 1 + 0.12 * Math.sin(g.time * 6);
      fillP(c, circlePath(this.giftBtn.r.r - 6 * g.dp, this.giftBtn.r.t + 6 * g.dp, 6 * g.dp * pulse), css(0xFFFF2E43));
    }
    g.fx.draw(c);
    if (this.popup) { c.fillStyle = css(0xFF000000, Math.min(1, this.popup.t * 5) * 170 / 255); c.fillRect(0, 0, g.W, g.H); this.popup.draw(c); }
  }

  drawNode(c, i) {
    const g = this.g, prog = this.prog;
    const x = this.nodeX(i), y = this.sy(i);
    if (y < -this.nodeR * 3 || y > g.H + this.nodeR * 3) return;
    const boss = i % 10 === 0, r = this.nodeR * (boss ? 1.22 : 1), cur = i === prog.maxLevel, done = i < prog.maxLevel;
    if (cur) {
      const pr = r * (1.35 + 0.15 * Math.sin(g.time * 4));
      fillP(c, circlePath(x, y, pr * 1.3), radGrad(c, x, y, pr * 1.3, [0xCCFFD24A, 0x00FF3B30]));
    }
    fillP(c, circlePath(x, y + r * 0.12, r), css(0x55301E14));
    const cols = cur ? [0xFFFFF4C2, 0xFFFFC94A, 0xFFB36B00] : done ? (boss ? [0xFFE2B3FF, 0xFFB24DFF, 0xFF56128F] : [0xFFFF9AA4, 0xFFFF2E43, 0xFF8A0016]) : [0xFFFFFCF4, 0xFFEFE4CF, 0xFFC9B99C];
    fillP(c, circlePath(x, y, r), radGrad(c, x - r * 0.3, y - r * 0.4, r * 1.6, cols, [0, 0.5, 1]));
    strokeP(c, circlePath(x, y, r), css((cur || done) ? 0xFFFFE9A8 : 0xFFFFFFFF), r * 0.1);
    strokeP(c, circlePath(x, y, r * 1.05), css(withA(Pal.INK, 200)), r * 0.06);
    fillP(c, ovalPath(x - r * 0.55, y - r * 0.8, x + r * 0.35, y - r * 0.3), css(0x55FFFFFF));
    Ui.txt(c, '' + i, x, y, r * (i >= 100 ? 0.62 : 0.78), cur ? 0xFF5A1200 : done ? 0xFFFFFFFF : 0xFF8C7A62, (cur || !done) ? 0 : 0xAA000000);
    if (done) {
      const st = prog.stars(i);
      for (let k = 0; k <= 2; k++) Ui.star(c, x + (k - 1) * r * 0.62, y - r * 1.12 - (k === 1 ? r * 0.18 : 0), r * 0.3, k < st);
    }
    if (boss && !done) Ui.txt(c, 'сложный', x, y + r * 1.35, r * 0.36, 0xFFFFE2B0);
    if (cur && g.sprites) {
      const by = y - r * 1.9 + Math.sin(g.time * 5) * r * 0.15, s = r * 1.5;
      drawImg(c, g.sprites.piece[0][NORMAL], x - s / 2, by - s / 2, x + s / 2, by + s / 2);
    }
  }
  stageY(st) { return st === 0 ? this.sy(1) + this.spacing * 0.6 : (this.sy(st * Meta.STAGE_LEN) + this.sy(st * Meta.STAGE_LEN + 1)) / 2; }
  bonusX() { return this.g.W * 0.86; }
  drawStage(c, st) {
    const g = this.g, prog = this.prog, y = this.stageY(st);
    if (y < -60 * g.dp || y > g.H + 60 * g.dp) return;
    const h = 30 * g.dp, w = g.W * 0.6, r = new R(g.W / 2 - w / 2, y - h / 2, g.W / 2 + w / 2, y + h / 2);
    Ui.panel(c, r, h / 2, 235);
    Ui.txt(c, 'Этап ' + (st + 1) + ' · ' + Meta.stageName(st), r.cx, r.cy, h * 0.48, 0xFFFFE9C0);
    if (st >= 1) {
      const bs = st - 1, open = prog.maxLevel > st * Meta.STAGE_LEN, played = prog.bonusPlayed(bs);
      const bx = this.bonusX(), rr = this.nodeR * 0.78;
      if (open && !played) { const pr = rr * (1.4 + 0.12 * Math.sin(g.time * 4)); fillP(c, circlePath(bx, y, pr), radGrad(c, bx, y, pr, [0xCCFFD24A, 0x00FFD24A])); }
      fillP(c, circlePath(bx, y, rr), radGrad(c, bx - rr * 0.3, y - rr * 0.3, rr * 1.6, open ? [0xFFFFF4C2, 0xFFF2B53C, 0xFF9C6A22] : [0xFFFFFCF4, 0xFFEFE4CF, 0xFFC9B99C], [0, 0.5, 1]));
      strokeP(c, circlePath(bx, y, rr), css(Pal.INK), rr * 0.08);
      Ui.gift(c, bx, y + rr * 0.05, rr * 0.5);
      if (played) Ui.check(c, bx + rr * 0.7, y - rr * 0.7, rr * 0.32);
      Ui.txt(c, 'бонус', bx, y + rr * 1.35, rr * 0.42, 0xFFFFFFFF);
    }
  }
  drawHeader(c) {
    const g = this.g, prog = this.prog;
    const top = g.safeTop + 8 * g.dp, h = 46 * g.dp, r = new R(8 * g.dp, top, g.W * 0.42, top + h);
    Ui.panel(c, r, h * 0.5, 230);
    Ui.star(c, r.l + h * 0.55, r.cy, h * 0.32, true);
    Ui.txt(c, '' + prog.wallet, (r.l + h * 1.0 + r.r) / 2, r.cy, h * 0.42);
    const st = Meta.stageOf(prog.maxLevel);
    const r2 = new R(g.W * 0.44, top, g.W - 8 * g.dp - 46 * g.dp * 2.4, top + h);
    if (r2.w > 60 * g.dp) { Ui.panel(c, r2, h * 0.5, 230); Ui.txt(c, 'Этап ' + (st + 1), r2.cx, r2.cy, h * 0.34, 0xFFFFE9C0); }
  }

  touch(action, x, y) {
    const g = this.g, prog = this.prog;
    if (this.popup) { this.popup.touch(action, x, y); return; }
    if (action === T_DOWN) {
      if (this.btns.down(x, y)) return;
      this.dragging = true; this.moved = false; this.downX = x; this.downY = y; this.lastY = y; this.lastT = performance.now(); this.vel = 0; this.camTarget = NaN;
    } else if (action === T_MOVE) {
      this.btns.move(x, y);
      if (!this.dragging) return;
      if (Math.abs(y - this.downY) > 10 * g.dp || Math.abs(x - this.downX) > 10 * g.dp) this.moved = true;
      const now = performance.now(), dts = Math.max(0.001, (now - this.lastT) / 1000), dy = y - this.lastY;
      this.camY -= dy;
      this.vel = this.vel * 0.6 + (dy / dts) * 0.4;
      this.lastY = y; this.lastT = now;
    } else {
      if (this.btns.up(x, y)) return;
      if (!this.dragging) return;
      this.dragging = false;
      if (this.moved) return;
      this.vel = 0;
      for (let st = 1; st <= Math.floor(prog.maxLevel / Meta.STAGE_LEN) + 1; st++) {
        const yy = this.stageY(st), dx = x - this.bonusX(), dy = y - yy;
        if (dx * dx + dy * dy < this.nodeR * this.nodeR * 1.4) {
          if (prog.maxLevel > st * Meta.STAGE_LEN) { g.audio.play('click', 0.6); this.popup = new BonusPopup(this, st - 1); }
          else { g.audio.play('bad', 0.5); g.fx.text('Пройдите этап ' + st, this.bonusX() - 40 * g.dp, yy - this.nodeR * 1.4, 16 * g.dp, 0xFFFFFFFF, 1.4); }
          return;
        }
      }
      const vMin = Math.max(1, Math.floor((this.anchor - this.camY - g.H) / this.spacing) - 1);
      const vMax = Math.floor((this.anchor - this.camY) / this.spacing) + 3;
      for (let i = vMin; i <= vMax; i++) {
        const dx = x - this.nodeX(i), dy = y - this.sy(i);
        if (dx * dx + dy * dy < this.nodeR * this.nodeR * 1.8) {
          if (i <= prog.maxLevel) { g.audio.play('click', 0.6); this.popup = new IntroPopup(this, i); }
          else { g.audio.play('bad', 0.5); g.fx.text('Сначала пройдите уровень ' + prog.maxLevel, g.W / 2, this.sy(i) - this.nodeR * 1.6, 16 * g.dp, 0xFFFFFFFF, 1.4); }
          break;
        }
      }
    }
  }
  back() { if (this.popup) { this.popup = null; return true; } return false; }
}

// ---------------- popups ----------------
class Popup {
  constructor(host) { this.host = host; this.g = host.g; this.t = 0; this.btns = new BtnSet(host.g); }
  update(dt) { this.t += dt; }
  touch(a, x, y) { if (a === T_DOWN) this.btns.down(x, y); else if (a === T_MOVE) this.btns.move(x, y); else this.btns.up(x, y); }
  scaleIn(c, r) {
    let k = 1;
    if (this.t < 0.28) { const e = this.t / 0.28; k = 0.6 + 0.4 * (1 - (1 - e) * (1 - e)) + Math.sin(e * PI) * 0.08; }
    c.translate(r.cx, r.cy); c.scale(k, k); c.translate(-r.cx, -r.cy);
  }
  closeBtn(r) {
    const s = 40 * this.g.dp;
    const b = new Btn(new R(r.r - s * 0.8, r.t - s * 0.2, r.r + s * 0.2, r.t + s * 0.8), '✕', 0xFFFF5A6B, 0xFFB3001E, () => { this.host.popup = null; });
    b.textSize = s * 0.45;
    return b;
  }
  centered(w, h) { const g = this.g; return new R((g.W - w) / 2, (g.H - h) / 2, (g.W + w) / 2, (g.H + h) / 2); }
}

class IntroPopup extends Popup {
  constructor(host, n) {
    super(host);
    const g = this.g, prog = g.prog;
    this.n = n; this.spec = LevelGen.generate(n); this.unlocks = Meta.unlocksAt(n); this.ready = false; this.pre = [false, false, false];
    this.preOpen = [0, 1, 2].some(k => prog.maxLevel >= Meta.preBoosts[k].unlock);
    const w = g.W * 0.88;
    const extra = (this.preOpen ? 84 * g.dp : 0) + (prog.streakOpen ? 22 * g.dp : 0);
    const h = Math.min(g.H * 0.92, g.H * ((this.spec.intro >= 0 || this.unlocks.length || n === 1) ? 0.66 : 0.52) + extra);
    this.rect = this.centered(w, h);
    const rect = this.rect, ph = 52 * g.dp;
    this.play = this.btns.add(new Btn(new R(rect.l + w * 0.18, rect.b - ph - 16 * g.dp, rect.r - w * 0.18, rect.b - 16 * g.dp), 'Играть', 0xFF4BE37F, 0xFF0E8A3A, () => this.start()));
    this.btns.add(this.closeBtn(rect));
    this.notesBottom = this.play.r.t - 14 * g.dp;
    if (this.preOpen) {
      const cs = 54 * g.dp, gap = 18 * g.dp, top = this.play.r.t - 14 * g.dp - cs, x0 = rect.cx - (cs * 3 + gap * 2) / 2;
      for (let k = 0; k <= 2; k++) {
        const b = new Btn(new R(x0 + k * (cs + gap), top, x0 + k * (cs + gap) + cs, top + cs), '', 0xFF6B7F99, 0xFF2B3A50, () => {
          const cnt = prog.preCount(k);
          if (prog.maxLevel < Meta.preBoosts[k].unlock) g.fx.text('С уровня ' + Meta.preBoosts[k].unlock, rect.cx, top - 10 * g.dp, 14 * g.dp, 0xFFFFFFFF, 1.2);
          else if (cnt <= 0 && !this.pre[k]) g.fx.text('Купите в Мастерской', rect.cx, top - 10 * g.dp, 14 * g.dp, 0xFFFFFFFF, 1.2);
          else this.pre[k] = !this.pre[k];
        });
        b.icon = (c, r) => this.drawPreChip(c, k, r);
        this.btns.add(b);
      }
      this.notesBottom = top - 30 * g.dp;
    }
    ensureTuned(g, this.spec, () => { this.ready = true; });
  }
  start() { if (!this.ready) return; this.g.go(new LevelScene(this.g, this.spec, MODE_CAMPAIGN, 0, this.pre)); }
  drawPreChip(c, k, r) {
    const g = this.g, prog = g.prog, sp = g.sprites; if (!sp) return;
    const pb = Meta.preBoosts[k], locked = prog.maxLevel < pb.unlock;
    if (this.pre[k]) strokeP(c, rrect(r.l, r.t, r.r, r.b, r.h * 0.45), css(Pal.GOLD), 3 * g.dp);
    const s = r.h * 0.7;
    drawImg(c, pb.kind === BOMB ? sp.bomb : sp.piece[0][pb.kind], r.cx - s / 2, r.cy - s / 2, r.cx + s / 2, r.cy + s / 2, locked ? 90 / 255 : 1);
    if (!locked) {
      const bx = r.r - r.w * 0.1, by = r.t + r.h * 0.1;
      fillP(c, circlePath(bx, by, r.h * 0.2), css(this.pre[k] ? 0xFF35A584 : Pal.PAPER));
      Ui.txt(c, this.pre[k] ? '✓' : '' + prog.preCount(k), bx, by, r.h * 0.24, this.pre[k] ? 0xFFFFFFFF : Pal.INK, 0);
    }
  }
  draw(c) {
    const g = this.g, prog = g.prog, rect = this.rect, spec = this.spec, n = this.n;
    this.play.enabled = this.ready;
    c.save(); this.scaleIn(c, rect);
    Ui.panel(c, rect, 26 * g.dp);
    const cx = rect.cx; let y = rect.t + 40 * g.dp;
    Ui.gradTxt(c, 'Уровень ' + n, cx, y, 34 * g.dp, 0xFFFFFFFF, 0xFFFFC94A, 0xFF2B211C);
    y += 30 * g.dp;
    if (spec.hard) { Ui.txt(c, 'Сложный уровень!', cx, y, 17 * g.dp, 0xFFFF6B7A); y += 26 * g.dp; }
    const st = prog.stars(n);
    for (let k = 0; k <= 2; k++) Ui.star(c, cx + (k - 1) * 46 * g.dp, y + 14 * g.dp - (k === 1 ? 8 * g.dp : 0), 20 * g.dp, k < st);
    y += 52 * g.dp;
    if (!this.ready) {
      Ui.txt(c, 'Настраиваем уровень…', cx, y + 20 * g.dp, 18 * g.dp, 0xFFFFE9C0);
      const sp = g.sprites;
      if (sp) for (let k = 0; k <= 4; k++) {
        const a = g.time * 4 + k * 1.2566, s = 22 * g.dp, px = cx + Math.cos(a) * 34 * g.dp, py = y + 75 * g.dp + Math.sin(a) * 18 * g.dp;
        drawImg(c, sp.icon[k], px - s / 2, py - s / 2, px + s / 2, py + s / 2);
      }
    } else {
      this.drawGoal(c, cx, y);
      y += 95 * g.dp;
      Ui.txt(c, 'Без ограничений · ★★★ за ' + spec.par3() + ' ход.', cx, y, 17 * g.dp, 0xFFFFE9C0);
      y += 22 * g.dp;
    }
    const notes = [];
    if (spec.intro >= 0) notes.push(['Новое: ' + featureName(spec.intro), featureText(spec.intro)]);
    for (const u of this.unlocks) notes.push(['Открыто: ' + u[0], u[1]]);
    if (n === 1) notes.push(['Как в «Монтесуме»', 'Собирайте кристаллы на камнях. Ходы не ограничены — чем меньше ходов, тем больше звёзд. Сильные ходы подряд наполняют колбу «Крещендо».']);
    if (notes.length && this.ready) {
      const maxB = this.notesBottom - (prog.streakOpen ? 22 * g.dp : 0);
      const fs = notes.length > 1 ? 13 * g.dp : 15 * g.dp, bw = rect.w - 44 * g.dp;
      let need = 20 * g.dp;
      for (const nt of notes.slice(0, 2)) need += fs * 1.7 + wrapText(c, nt[1], fs, bw - 24 * g.dp).length * fs * 1.4 + fs * 0.5;
      const box = new R(rect.l + 22 * g.dp, y + 6 * g.dp, rect.r - 22 * g.dp, Math.min(maxB, y + 6 * g.dp + need));
      fillP(c, rrect(box.l, box.t, box.r, box.b, 16 * g.dp), css(0x33F2B53C));
      let ly = box.t + 20 * g.dp;
      for (const nt of notes.slice(0, 2)) {
        Ui.txt(c, nt[0], box.cx, ly, fs * 1.15, 0xFFFFE08A); ly += fs * 1.7;
        for (const l of wrapText(c, nt[1], fs, box.w - 24 * g.dp)) { Ui.txtM(c, l, box.cx, ly, fs, 0xFFFFFFFF, 0x88000000); ly += fs * 1.4; }
        ly += fs * 0.5;
      }
    }
    if (this.preOpen) Ui.txtM(c, 'Стартовые бустеры', rect.cx, this.btns.list[2].r.t - 12 * g.dp, 13 * g.dp, 0xFFFFE9C0);
    if (prog.streakOpen) {
      const st2 = Math.min(prog.streak, 4);
      const yy = this.preOpen ? this.btns.list[2].r.t - 34 * g.dp : this.play.r.t - 16 * g.dp;
      const sTxt = st2 > 0 ? 'Серия побед ×' + prog.streak + ': +' + st2 + ' спецфишк. на старте' : 'Побеждайте подряд — серия даст спецфишки на старте';
      const sFs = Math.min(13 * g.dp, 13 * g.dp * (rect.w - 32 * g.dp) / Math.max(1, Ui.measure(c, sTxt, 13 * g.dp)));
      Ui.txtM(c, sTxt, rect.cx, yy, sFs, Pal.GOLD);
    }
    this.btns.draw(c);
    c.restore();
  }
  drawGoal(c, cx, y) {
    const g = this.g, sp = g.sprites, spec = this.spec; if (!sp) return;
    const s = 44 * g.dp, items = [];
    items.push([x => drawImg(c, sp.crystalBig, x - s / 2, y, x + s / 2, y + s), '' + spec.crystalGoal]);
    if (spec.goal === G_JELLY) items.push([x => Ui.jellyIcon(c, x, y + s / 2, s * 0.42), 'всё']);
    else if (spec.goal === G_INGR) items.push([x => drawImg(c, sp.ingr, x - s / 2, y, x + s / 2, y + s), '' + spec.ingrTotal]);
    else if (spec.goal === G_ORGAN) items.push([x => drawImg(c, sp.organ, x - s / 2, y, x + s / 2, y + s), '' + spec.organGoal]);
    else if (spec.goal === G_COLLECT) spec.collectColors.forEach((col, j) => items.push([x => drawImg(c, sp.icon[col], x - s / 2, y, x + s / 2, y + s), '' + spec.collectCounts[j]]));
    items.forEach((it, j) => {
      const x = cx + (j - (items.length - 1) / 2) * s * 1.7;
      it[0](x);
      Ui.txt(c, it[1], x, y + s + 14 * g.dp, 18 * g.dp);
    });
  }
}

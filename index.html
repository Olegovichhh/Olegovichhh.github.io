class ShopScene {
  constructor(g, next) {
    this.g = g; this.prog = g.prog; this.next = next; this.btns = new BtnSet(g);
    this.scroll = 0; this.vel = 0; this.listTop = 0; this.listBottom = 0; this.cardH = 0;
    this.downY = 0; this.lastY = 0; this.dragging = false; this.moved = false; this.flash = -1; this.flashT = 0;
    this.rows = []; this.upRects = new Map();
  }
  layout() {
    const g = this.g, rows = this.rows = [];
    rows.push({ isTotem: true, id: -1, header: 'Тотемы-инструменты' });
    for (const t of Meta.totems.slice().sort((a, b) => a.unlock - b.unlock)) rows.push({ isTotem: true, id: t.color, kind: 0 });
    rows.push({ isTotem: false, id: -1, header: 'Бонусы на камнях' });
    for (const b of Meta.bonuses) rows.push({ isTotem: false, id: b.kind, kind: 0 });
    rows.push({ isTotem: false, id: -1, header: 'Инструменты (не тратят ход)' });
    for (const t of Meta.tools) rows.push({ isTotem: false, id: t.id, kind: 1 });
    rows.push({ isTotem: false, id: -1, header: 'Стартовые бустеры' });
    for (const pb of Meta.preBoosts) rows.push({ isTotem: false, id: pb.id, kind: 2 });
    this.cardH = 100 * g.dp;
    this.listTop = g.safeTop + 108 * g.dp;
    const bh = 50 * g.dp;
    this.listBottom = g.H - g.safeBottom - bh - 24 * g.dp;
    this.btns.clear();
    const label = this.next > 0 ? 'Играть уровень ' + this.next : 'На карту';
    this.btns.add(new Btn(new R(g.W * 0.12, this.listBottom + 12 * g.dp, g.W * 0.88, this.listBottom + 12 * g.dp + bh), label, 0xFF4BC27F, 0xFF167A44,
      () => g.go(new MapScene(g, this.next > 0 ? Math.min(this.next, this.prog.maxLevel) : -1))));
  }
  rowH(r) { return r.header ? 40 * this.g.dp : this.cardH + 10 * this.g.dp; }
  get contentH() { return this.rows.reduce((s, r) => s + this.rowH(r), 0); }
  get maxScroll() { return Math.max(0, this.contentH - (this.listBottom - this.listTop)); }
  update(dt) {
    this.g.fx.update(dt);
    if (!this.dragging && Math.abs(this.vel) > 1) { this.scroll -= this.vel * dt; this.vel *= (1 - Math.min(1, dt * 3.5)); }
    this.scroll = clamp(this.scroll, 0, this.maxScroll);
    if (this.flashT > 0) this.flashT -= dt;
  }
  draw(c) {
    const g = this.g, prog = this.prog, dp = g.dp, sp = g.sprites;
    g.drawBackground(c, 0, 0);
    if (!sp) return;
    Ui.gradTxt(c, 'Мастерская', g.W / 2, g.safeTop + 34 * dp, 32 * dp, 0xFFFFFFFF, 0xFFE98638, Pal.INK);
    const wr = new R(g.W / 2 - 70 * dp, g.safeTop + 58 * dp, g.W / 2 + 70 * dp, g.safeTop + 94 * dp);
    Ui.panel(c, wr, 18 * dp, 235);
    Ui.star(c, wr.l + 22 * dp, wr.cy, 12 * dp, true);
    Ui.txt(c, '' + prog.wallet, wr.cx + 10 * dp, wr.cy, 20 * dp);
    c.save(); c.beginPath(); c.rect(0, this.listTop - 4 * dp, g.W, this.listBottom - this.listTop + 4 * dp); c.clip();
    this.upRects.clear();
    let y = this.listTop - this.scroll;
    this.rows.forEach((r, idx) => {
      const h = this.rowH(r);
      if (y + h < this.listTop - 10 || y > this.listBottom + 10) { y += h; return; }
      if (r.header) { Ui.txt(c, r.header, g.W / 2, y + 22 * dp, 18 * dp, 0xFF2B4A78, 0xCCFFFFFF); y += h; return; }
      const card = new R(12 * dp, y, g.W - 12 * dp, y + this.cardH);
      if (r.kind !== 0) { this.drawBuyCard(c, idx, r, card); y += h; return; }
      let lvl, unlock, name, desc, vals, cost, icon;
      if (r.isTotem) {
        const t = Meta.totems[r.id];
        lvl = prog.totemLevel(r.id); unlock = t.unlock; name = 'Тотем «' + t.name + '»';
        const cur = lvl > 0 ? t.values[lvl - 1] : t.values[0];
        const d = t.power.indexOf(': ') >= 0 ? t.power.slice(t.power.indexOf(': ') + 2) : t.power;
        desc = d.charAt(0).toUpperCase() + d.slice(1);
        vals = (lvl >= 1 && lvl < Meta.MAX_LVL) ? this.fmt(cur, t.unit) + '  →  ' + this.fmt(t.values[lvl], t.unit) : this.fmt(cur, t.unit);
        cost = (lvl >= 1 && lvl < Meta.MAX_LVL) ? Meta.totemCost[lvl] : 0;
        icon = lvl > 0 ? sp.totem[r.id] : sp.totemLocked[r.id];
      } else {
        const b = Meta.bonusDef(r.id);
        lvl = prog.bonusLevel(r.id); unlock = b.unlock; name = b.name;
        const cur = lvl > 0 ? b.values[lvl - 1] : b.values[0];
        desc = b.about;
        vals = (lvl >= 1 && lvl < Meta.MAX_LVL) ? this.bfmt(r.id, cur, b.unit) + '  →  ' + this.bfmt(r.id, b.values[lvl], b.unit) : this.bfmt(r.id, cur, b.unit);
        cost = (lvl >= 1 && lvl < Meta.MAX_LVL) ? Meta.bonusCost[lvl] : 0;
        icon = sp.badge[r.id];
      }
      const maxed = lvl >= Meta.MAX_LVL;
      Ui.panel(c, card, 18 * dp, lvl > 0 ? 240 : 170);
      if (this.flash === idx && this.flashT > 0) fillP(c, rrect(card.l, card.t, card.r, card.b, 18 * dp), css(withA(Pal.GOLD, clamp(Math.floor(160 * this.flashT / 0.6), 0, 255))));
      const isz = this.cardH * 0.66;
      drawImg(c, icon, card.l + 12 * dp, card.cy - isz / 2, card.l + 12 * dp + isz, card.cy + isz / 2, lvl > 0 ? 1 : 150 / 255);
      const tx = card.l + 22 * dp + isz;
      Ui.txt(c, name, tx, card.t + 22 * dp, 16 * dp, lvl > 0 ? 0xFFFFFFFF : 0xFFBFC8D6, 0xFF2B211C, 'left');
      for (let k = 0; k < Meta.MAX_LVL; k++) fillP(c, circlePath(tx + 6 * dp + k * 15 * dp, card.t + 44 * dp, 5 * dp), css(k < lvl ? Pal.GOLD : 0x55FFFFFF));
      const btnW = 86 * dp;
      const lines = wrapText(c, desc, 12 * dp, card.r - btnW - 18 * dp - tx);
      lines.slice(0, 2).forEach((l, j) => Ui.txtM(c, l, tx, card.t + 60 * dp + j * 15 * dp, 12 * dp, 0xFFE6EDF7, 0, 'left'));
      Ui.txt(c, vals, tx, card.t + 60 * dp + Math.min(2, lines.length) * 15 * dp + 2 * dp, 13 * dp, Pal.GOLD, Pal.INK, 'left');
      const br = new R(card.r - btnW - 10 * dp, card.cy - 20 * dp, card.r - 10 * dp, card.cy + 20 * dp);
      if (lvl === 0) Ui.txt(c, 'ур. ' + unlock, br.cx, br.cy, 15 * dp, 0xFFBFC8D6);
      else if (maxed) Ui.txt(c, 'Макс.', br.cx, br.cy, 16 * dp, Pal.GOLD);
      else {
        const can = prog.wallet >= cost;
        Ui.button(c, br, '★ ' + cost, can ? 0xFFFFC94A : 0xFF7A8599, can ? 0xFFB36B00 : 0xFF3A4458, false, 17 * dp, true);
        this.upRects.set(idx, br);
      }
      y += h;
    });
    c.restore();
    this.btns.draw(c);
    g.fx.draw(c);
  }
  drawBuyCard(c, idx, r, card) {
    const g = this.g, prog = this.prog, dp = g.dp, sp = g.sprites;
    let name, about, unlock, cost, cnt;
    if (r.kind === 1) { const t = Meta.tools[r.id]; name = t.name; about = t.about; unlock = t.unlock; cost = t.cost; cnt = prog.toolCount(r.id); }
    else { const pb = Meta.preBoosts[r.id]; name = pb.name; about = 'Появится на поле в начале уровня'; unlock = pb.unlock; cost = pb.cost; cnt = prog.preCount(r.id); }
    const open = prog.maxLevel >= unlock;
    Ui.panel(c, card, 18 * dp, open ? 240 : 170);
    if (this.flash === idx && this.flashT > 0) fillP(c, rrect(card.l, card.t, card.r, card.b, 18 * dp), css(withA(Pal.GOLD, clamp(Math.floor(160 * this.flashT / 0.6), 0, 255))));
    const isz = this.cardH * 0.62, icx = card.l + 12 * dp + isz / 2, icy = card.cy;
    if (r.kind === 1) { fillP(c, circlePath(icx, icy, isz / 2), css(0xFF1D3150)); Icons.drawTool(c, r.id, icx, icy, isz * 0.3); }
    else { const kind = Meta.preBoosts[r.id].kind; drawImg(c, kind === BOMB ? sp.bomb : sp.piece[0][kind], icx - isz / 2, icy - isz / 2, icx + isz / 2, icy + isz / 2); }
    const tx = card.l + 22 * dp + isz;
    Ui.txt(c, name, tx, card.t + 24 * dp, 16 * dp, open ? 0xFFFFFFFF : 0xFFBFC8D6, 0xFF2B211C, 'left');
    Ui.txt(c, open ? 'Есть: ' + cnt : 'Откроется на уровне ' + unlock, tx, card.t + 48 * dp, 13 * dp, Pal.GOLD, Pal.INK, 'left');
    wrapText(c, about, 12 * dp, card.w - 130 * dp - isz).slice(0, 2).forEach((l, j) => Ui.txtM(c, l, tx, card.t + 70 * dp + j * 15 * dp, 12 * dp, 0xFFE6EDF7, 0, 'left'));
    if (open) {
      const br = new R(card.r - 96 * dp, card.cy - 20 * dp, card.r - 10 * dp, card.cy + 20 * dp);
      const can = prog.wallet >= cost;
      Ui.button(c, br, '+1 ★' + cost, can ? 0xFFFFC94A : 0xFF7A8599, can ? 0xFFB36B00 : 0xFF3A4458, false, 15 * dp, true);
      this.upRects.set(idx, br);
    }
  }
  fmt(v, unit) { return v >= 99 ? 'все' : v + ' ' + unit; }
  bfmt(kind, v, unit) { return kind === BN_TNT ? (v >= 5 ? '5×5' : '3×3') : kind === BN_TUNE ? v + '%' : kind === BN_STAR ? '★' + v : v + ' ' + unit; }
  touch(action, x, y) {
    const g = this.g;
    if (action === T_DOWN) {
      if (this.btns.down(x, y)) return;
      this.dragging = true; this.moved = false; this.downY = y; this.lastY = y; this.vel = 0;
    } else if (action === T_MOVE) {
      this.btns.move(x, y);
      if (!this.dragging) return;
      if (Math.abs(y - this.downY) > 8 * g.dp) this.moved = true;
      const dy = y - this.lastY; this.scroll -= dy; this.vel = this.vel * 0.5 + dy * 30; this.lastY = y;
    } else {
      if (this.btns.up(x, y)) return;
      this.dragging = false;
      if (this.moved) return;
      this.vel = 0;
      for (const [idx, r] of this.upRects) if (r.contains(x, y)) { this.buy(idx, r); return; }
    }
  }
  buy(idx, r) {
    const g = this.g, prog = this.prog, row = this.rows[idx];
    const ok = row.kind === 1 ? prog.buyTool(row.id) : row.kind === 2 ? prog.buyPre(row.id) : row.isTotem ? prog.upgradeTotem(row.id) : prog.upgradeBonus(row.id);
    if (ok) {
      g.audio.play('create', 0.8); g.vibe(20);
      this.flash = idx; this.flashT = 0.6;
      g.fx.burst(r.cx, r.cy, Pal.GOLD, 20, 300 * g.dp, 5 * g.dp);
      g.fx.text(row.kind === 0 ? 'Улучшено!' : 'Куплено!', r.cx - 40 * g.dp, r.t - 6 * g.dp, 16 * g.dp, Pal.GOLD, 0.9);
    } else {
      g.audio.play('bad', 0.6);
      g.fx.text('Не хватает звёзд', r.cx - 40 * g.dp, r.t - 6 * g.dp, 15 * g.dp, 0xFFFFFFFF, 1.0);
    }
  }
  back() { this.g.go(new MapScene(this.g, -1)); return true; }
}

// ---- level.js ----
// ===================== level scene (port of LevelScene.kt) =====================
const PH_INTRO = 0, PH_IDLE = 1, PH_SWAP = 2, PH_SWAPBACK = 3, PH_CLEAR = 4, PH_FALL = 5, PH_SHUFFLE = 6, PH_FINALE = 7, PH_END = 8;
const GREEN = [0xFF4BC27F, 0xFF167A44], GREY = [0xFF6B7F99, 0xFF2B3A50], WOOD = [0xFFE9A062, 0xFF9A5426];

class LevelScene {
  constructor(g, spec, mode = MODE_CAMPAIGN, stage = 0, preSel = [false, false, false]) {
    this.g = g; this.spec = spec; this.mode = mode; this.stage = stage; this.prog = g.prog;
    const prog = this.prog, rng = this.rng = new Rng();
    prog.applyBonuses(spec);
    if (mode === MODE_BONUS) {
      spec.maxBonuses = 12;
      if (spec.bonusLevel === 0) { spec.bonusKinds = spec.bonusKinds.concat(new Array(8).fill(BN_STAR)); spec.bonusChance = 0.12; }
      else if (spec.bonusLevel === 1) spec.crystalChance = 0.35;
      else { spec.bonusKinds = spec.bonusKinds.concat([BN_TNT, BN_LIGHT, BN_TIME]); spec.bonusChance = 0.12; }
    }
    const board = this.board = spec.build(rng);
    this.toolRect = [0, 1, 2, 3].map(() => new R(0, 0, 0, 0));
    this.toolMode = -1; this.toolTurn = false;
    this.wobble = new Float32Array(board.n);
    this.startSpecials = []; this.streakUsed = 0;
    const kinds = [];
    if (mode === MODE_CAMPAIGN) {
      for (let k = 0; k <= 2; k++) if (preSel[k] && prog.usePre(k)) kinds.push(Meta.preBoosts[k].kind);
      if (prog.streakOpen) { this.streakUsed = Math.min(prog.streak, 4); for (let k = 0; k < this.streakUsed; k++) kinds.push(Meta.streakKinds[k]); }
    }
    const cells = rng.shuffled([...Array(board.n).keys()].filter(i => { const p = board.pieces[i]; return p && p.kind === NORMAL && !p.crystal && p.bonus === 0 && board.open(i) && !board.lock[i]; }));
    kinds.forEach((kind, k) => {
      if (k >= cells.length) return;
      const p = board.pieces[cells[k]];
      p.kind = (kind === STRIPE_H && rng.nextBoolean()) ? STRIPE_V : kind;
      this.startSpecials.push(cells[k]);
    });
    this.moveBudget = mode === MODE_BONUS ? 15 : mode === MODE_ARCADE ? 25 : 0;
    this.movesUsed = 0; this.movesAtGoal = 0; this.multMoves = 0; this.frenzyMoves = 0;
    this.flask = 0; this.combo = 0; this.starsEarned = 0;
    this.totemLvl = [0, 1, 2, 3, 4, 5].map(c => prog.totemLevel(c));
    this.charge = new Float32Array(6);
    this.prevColors = new Set(); this.curColors = new Set();
    this.turnHadMatch = false; this.pendingTotem = -1;
    this.totemFlash = new Float32Array(6); this.totemTip = -1; this.totemTipT = 0;
    this.totemRect = [0, 1, 2, 3, 4, 5].map(() => new R(0, 0, 0, 0));
    this.flaskRect = new R(0, 0, 0, 0);
    this.crystalIcon = [0, 0];
    this.cell = 50; this.ox = 0; this.oy = 0; this.hudTop = 0; this.hudH = 0;
    this.boardRect = new R(0, 0, 0, 0);
    this.bar = new BtnSet(g);
    this.ph = PH_INTRO; this.phT = 0;
    this.swapA = -1; this.swapB = -1; this.swapKind = 0;
    this.sel = -1; this.downCell = -1; this.downX = 0; this.downY = 0; this.dragDone = false;
    this.idleT = 0; this.hint = null; this.finale = false; this.finaleT = 0; this.finaleNote = 0; this.finaleRounds = 0;
    this.clearTimer = 0; this.shownScore = 0; this.overlay = null;
    this.dying = []; this.flyers = []; this.chocGrow = []; this.projs = []; this.fires = []; this.giftGlow = [];
    this.goalIconPos = []; this.lastTurnCleared = 0; this.pendingPref = null;
    this.boardBg = null; this.bgMargin = 0;
  }
  get par3() { return this.spec.par3(); }
  get par2() { return this.spec.par2(); }
  totemReady(c) { return this.totemLvl[c] > 0 && this.charge[c] >= Meta.totemCharge[this.totemLvl[c] - 1]; }
  get scoreMult() { return (this.multMoves > 0 ? 2 : 1) * (this.frenzyMoves > 0 ? 2 : 1); }

  layout() {
    const g = this.g, dp = g.dp, board = this.board;
    this.hudTop = g.safeTop + 6 * dp;
    this.hudH = Math.max(g.H * 0.11, 82 * dp);
    const ts = Math.min(58 * dp, (g.W - 16 * dp) / 7.4);
    const totemTop = g.H - g.safeBottom - ts - 10 * dp;
    const flaskH = 16 * dp, flaskTop = totemTop - 14 * dp - flaskH;
    this.flaskRect.set(16 * dp, flaskTop, g.W - 16 * dp, flaskTop + flaskH);
    const availTop = this.hudTop + this.hudH + 10 * dp;
    const tsz = 44 * dp, toolTop = flaskTop - 10 * dp - tsz, tgap = 14 * dp, tx0 = (g.W - (tsz * 4 + tgap * 3)) / 2;
    for (let k = 0; k < 4; k++) this.toolRect[k].set(tx0 + k * (tsz + tgap), toolTop, tx0 + k * (tsz + tgap) + tsz, toolTop + tsz);
    const availH = toolTop - 10 * dp - availTop, availW = g.W - 12 * dp;
    const oldCell = this.cell;
    this.cell = Math.min(availW / board.w, availH / board.h);
    if (this.cell !== oldCell) this.boardBg = null;
    g.cell = this.cell;
    this.ox = (g.W - this.cell * board.w) / 2;
    this.oy = availTop + (availH - this.cell * board.h) / 2;
    this.boardRect.set(this.ox, this.oy, this.ox + this.cell * board.w, this.oy + this.cell * board.h);
    const gap = (g.W - ts * 7) / 8;
    for (let c = 0; c < 6; c++) { const x = gap + c * (ts + gap); this.totemRect[c].set(x, totemTop, x + ts, totemTop + ts); }
    this.bar.clear();
    const px0 = gap + 6 * (ts + gap);
    const pb = this.bar.add(new Btn(new R(px0, totemTop + ts * 0.08, px0 + ts, totemTop + ts * 0.92), '', 0xFF6B7F99, 0xFF2B3A50, () => this.openPause()));
    pb.icon = (c, r) => Ui.pause(c, r.cx, r.cy, r.h * 0.3);
    if (this.laidOut) return; // relayout after resize: keep the game state
    this.laidOut = true;
    for (let i = 0; i < board.n; i++) {
      const p = board.pieces[i]; if (!p) continue;
      p.vy = board.cy(i) - board.h - 1.5 - board.cx(i) * 0.35;
      p.vx = board.cx(i);
      p.path = [i];
    }
    g.audio.play('shuffle', 0.5);
    const title = this.mode === MODE_BONUS ? 'Бонус: ' + Meta.bonusLevelNames[this.spec.bonusLevel]
      : this.mode === MODE_ENDLESS ? 'Бесконечный режим' : this.mode === MODE_ARCADE ? 'Испытание: 25 ходов' : goalText(this.spec);
    g.fx.text(title, g.W / 2, this.oy + this.cell * board.h / 2, 26 * dp, Pal.GOLD, 1.3, true);
    if (this.startSpecials.length) g.fx.at(1.0, () => {
      for (const i of this.startSpecials) { g.fx.sparkle(this.px(i), this.py(i), Pal.GOLD, 14, this.cell, this.cell * 0.3); g.fx.ring(this.px(i), this.py(i), this.cell, -1); }
      g.audio.play('create', 0.7);
      if (this.streakUsed > 0) g.fx.text('Серия побед ×' + this.streakUsed + '!', g.W / 2, this.oy + this.cell * board.h * 0.35, 24 * g.dp, Pal.GOLD, 1.4, true);
    });
  }

  px(i) { return this.ox + (this.board.cx(i) + 0.5) * this.cell; }
  py(i) { return this.oy + (this.board.cy(i) + 0.5) * this.cell; }
  cellAt(x, y) {
    if (!this.boardRect.contains(x, y)) return -1;
    const cx = Math.floor((x - this.ox) / this.cell), cy = Math.floor((y - this.oy) / this.cell);
    if (!this.board.inb(cx, cy)) return -1;
    const i = this.board.idx(cx, cy);
    return this.board.mask[i] ? i : -1;
  }
  adjacent(a, b) { const bd = this.board; return Math.abs(bd.cx(a) - bd.cx(b)) + Math.abs(bd.cy(a) - bd.cy(b)) === 1; }

  // ---- moving while the board is still resolving ----
  live() { return this.ph === PH_CLEAR || this.ph === PH_FALL || this.ph === PH_SHUFFLE; }
  canPlay() { return (this.ph === PH_IDLE || this.live()) && !(this.moveBudget > 0 && this.movesUsed >= this.moveBudget); }
  settled(i) { const p = this.board.pieces[i]; return !!p && this.board.movable(i) && p.path.length === 0; }
  liveSwap(a, b) {
    const g = this.g, board = this.board;
    if (!this.settled(a) || !this.settled(b)) { g.audio.play('bad', 0.4); return; }
    const kind = board.swapKind(a, b);
    if (kind === 0) { this.wobble[a] = 0.3; this.wobble[b] = 0.3; g.audio.play('bad', 0.5); return; }
    const ca = board.pieces[a].color, cb = board.pieces[b].color;
    board.doSwap(a, b);
    board.pieces[a].path.push(a); board.pieces[b].path.push(b);
    board.pieces[a].speed = 9; board.pieces[b].speed = 9;
    this.hint = null; this.sel = -1;
    g.audio.play('swap', 0.6);
    this.beginPlayerTurn();
    this.turnHadMatch = true;
    if (ca >= 0 && ca <= 5) this.curColors.add(ca); if (cb >= 0 && cb <= 5) this.curColors.add(cb);
    if (kind === 2) this.play(board.comboSwap(a, b)); else this.pendingPref = [b, a];
    this.resolveTotems();
  }
  skipFinale() {
    const left = Math.max(0, Math.min(15, this.par2 - this.movesAtGoal) - this.finaleNote);
    this.board.score += left * 450 + this.board.specialCount() * 500;
    this.finaleNote = 15;
    this.g.audio.play('star', 0.6);
    this.win();
  }
  trySwap(a, b) {
    if (this.live()) { this.liveSwap(a, b); return; }
    if (!this.board.movable(a) || !this.board.movable(b)) { this.g.audio.play('bad', 0.5); return; }
    this.swapA = a; this.swapB = b; this.swapKind = this.board.swapKind(a, b);
    this.ph = PH_SWAP; this.phT = 0; this.hint = null; this.sel = -1;
    this.g.audio.play('swap', 0.6);
  }
  beginPlayerTurn() {
    const g = this.g;
    this.curColors = new Set(); this.turnHadMatch = false;
    this.movesUsed++;
    if (this.multMoves > 0) this.multMoves--;
    if (this.frenzyMoves > 0) { this.frenzyMoves--; if (this.frenzyMoves === 0) this.flask = 0; }
    this.combo = this.lastTurnCleared >= 5 ? this.combo + 1 : 1;
    this.lastTurnCleared = 0;
    if (this.combo >= 2) g.fx.text('Комбо ×' + this.combo, this.flaskRect.l + 60 * g.dp, this.flaskRect.t - 16 * g.dp, (15 + Math.min(this.combo, 8)) * g.dp, Pal.GOLD, 0.9);
    if (this.combo > 0 && this.combo % 5 === 0) this.earnStar(1, this.flaskRect.cx, this.flaskRect.t);
  }
  earnStar(k, x, y) {
    this.starsEarned += k;
    this.g.fx.text('★+' + k, x, y - 10 * this.g.dp, 20 * this.g.dp, Pal.GOLD, 1.0);
    this.g.audio.play('star', 0.5, 1.3);
  }

  play(r, firstOfTurn = false) {
    const g = this.g, dp = g.dp, sp = g.sprites, board = this.board, spec = this.spec, cell = this.cell, rng = this.rng;
    const extra = r.points * (this.scoreMult - 1);
    if (extra > 0) board.score += extra;
    const pts = r.points + extra;
    let sx = 0, sy = 0, sn = 0;
    for (const cf of r.clears) {
      this.dying.push({ p: cf.piece, i: cf.i, t: -cf.delay });
      if (cf.delay === 0) { sx += this.px(cf.i); sy += this.py(cf.i); sn++; }
      const p = cf.piece;
      if (p.kind !== BOMB && p.kind !== INGR && p.color >= 0 && p.color <= 5 && this.totemLvl[p.color] > 0) {
        const need = Meta.totemCharge[this.totemLvl[p.color] - 1], before = this.charge[p.color];
        this.charge[p.color] = Math.min(need, this.charge[p.color] + 1);
        if (before < need && this.charge[p.color] >= need) { this.totemFlash[p.color] = 1; g.audio.play('create', 0.4, 1.4); }
      }
      const wanted = spec.goal === G_COLLECT && this.mode === MODE_CAMPAIGN && p.kind !== BOMB && spec.collectColors.includes(p.color);
      if (wanted && sp) {
        const target = this.goalIconPos[spec.collectColors.indexOf(p.color)];
        if (target && this.flyers.length < 40) {
          const x0 = this.px(cf.i), y0 = this.py(cf.i);
          g.fx.at(cf.delay + 0.05, () => this.flyers.push({ bm: sp.icon[p.color], x0, y0, x1: target[0], y1: target[1], t: 0, dur: 0.55 + rng.nextFloat() * 0.15 }));
        }
      }
    }
    if (firstOfTurn) for (const c of r.matchColors) if (c >= 0 && c <= 5) this.curColors.add(c);
    if (r.clears.length) this.turnHadMatch = true;
    this.lastTurnCleared += r.clears.length;
    if (this.frenzyMoves <= 0) {
      const k = (this.mode === MODE_BONUS && spec.bonusLevel === 2) ? 3 : 1;
      this.flask += r.clears.length * 0.010 * (1 + 0.22 * Math.max(0, this.combo - 1)) * k;
      if (this.flask >= 1) this.startFrenzy();
    }
    r.matchColors.forEach((col, k) => g.fx.at(k * 0.05, () => g.audio.note(col, r.cascade)));
    for (const b of r.beams) g.fx.at(b.delay, () => {
      g.fx.beam(this.px(b.i), this.py(b.i), b.horizontal, b.color, b.horizontal ? cell * board.w : cell * board.h);
      g.audio.play('zap', 0.7); g.fx.shake = Math.max(g.fx.shake, 0.35); g.vibe(15);
    });
    for (const b of r.blasts) g.fx.at(b.delay, () => {
      g.fx.ring(this.px(b.i), this.py(b.i), cell * (b.radius + 1.2), b.color);
      if (b.color >= 0 && b.color <= 5) g.fx.burst(this.px(b.i), this.py(b.i), Pal.base[b.color], 20, cell * 6, cell * 0.1);
      g.audio.play('boom', 0.8); g.fx.shake = Math.max(g.fx.shake, 0.6 + b.radius * 0.1); g.vibe(25);
    });
    for (const f of r.flies) g.fx.at(f.delay, () => {
      const s2 = g.sprites; if (!s2) return;
      const c = clamp(f.color, 0, 5);
      const carry = f.carry !== NORMAL ? s2.piece[c][f.carry] : null;
      this.projs.push({ bm: s2.piece[c][PROP], carry, x0: this.px(f.from), y0: this.py(f.from), x1: this.px(f.to), y1: this.py(f.to), color: c, t: 0 });
      g.audio.play('fly', 0.7, 0.9 + rng.nextFloat() * 0.25); g.vibe(10);
    });
    for (const f of r.flies) g.fx.at(f.delay + FLY_T, () => {
      g.fx.ring(this.px(f.to), this.py(f.to), cell * 1.1, f.color);
      g.fx.sparkle(this.px(f.to), this.py(f.to), 0xFFFFFFFF, 8, cell, cell * 0.25);
    });
    if (r.bolts.length) {
      g.audio.play('bomb', 0.8); g.vibe(30);
      for (const b of r.bolts) g.fx.at(b.delay, () => g.fx.bolt(this.px(b.from), this.py(b.from), this.px(b.to), this.py(b.to), b.color));
    }
    for (const b of r.blocks) g.fx.at(b.delay, () => {
      const x = this.px(b.i), y = this.py(b.i);
      switch (b.type) {
        case B_ICE_HIT: case B_ICE_BREAK: g.fx.burst(x, y, 0xFF8FC6E8, b.type === B_ICE_BREAK ? 16 : 7, cell * 4, cell * 0.09); g.audio.play('crack', 0.6); break;
        case B_CHOC: g.fx.burst(x, y, 0xFF9A2C6A, 12, cell * 4, cell * 0.08); g.audio.play('crack', 0.5, 0.7); break;
        case B_LOCK: g.fx.burst(x, y, 0xFF9AA7B8, 10, cell * 4, cell * 0.08); g.audio.play('clank', 0.6); break;
        case B_JELLY: g.fx.sparkle(x, y, 0xFFFF7FB0, 6, cell * 0.8, cell * 0.2); g.audio.play('blop', 0.45); break;
        case B_BOX: g.fx.burst(x, y, 0xFFB5783E, 10, cell * 4, cell * 0.09); this.wobble[b.i] = 0.3; g.audio.play('crack', 0.6, 0.8); break;
        case B_CAB: g.fx.burst(x + cell / 2, y + cell / 2, 0xFF6A3E28, 12, cell * 4, cell * 0.1); this.wobble[b.i] = 0.35; g.audio.play('clank', 0.6, 0.7); break;
        case B_PAL: g.fx.sparkle(x, y, Pal.GOLD, 8, cell * 0.7, cell * 0.2); this.wobble[b.i] = 0.25; g.audio.play('blop', 0.5, 1.3); break;
        case B_ORGAN: {
          this.wobble[b.i] = 0.3; g.audio.noteRaw(5 + rng.nextInt(8), 0.5);
          const t = this.goalIconPos[0];
          if (g.sprites && t && spec.goal === G_ORGAN) this.flyers.push({ bm: g.sprites.organNote, x0: x, y0: y, x1: t[0], y1: t[1], t: 0, dur: 0.6 });
          break;
        }
        case B_GONE: g.fx.burst(x, y, 0xFFF6E7C8, 16, cell * 5, cell * 0.1); g.fx.sparkle(x, y, Pal.GOLD, 8, cell, cell * 0.25); g.audio.play('boom', 0.5, 1.3); break;
      }
    });
    for (const cr of r.creates) {
      g.fx.sparkle(this.px(cr.i), this.py(cr.i), cr.piece.kind === BOMB ? 0xFFFFFFFF : Pal.light[cr.piece.color], 14, cell, cell * 0.3);
      g.audio.play('create', 0.6);
      if (cr.piece.kind === BOMB) g.fx.text('Аккорд!', g.W / 2, this.oy + cell * board.h * 0.3, 40 * dp, 0xFF8A54B6, 1.1, true);
    }
    for (const cl of r.collects) {
      g.audio.play('collect', 0.8);
      this.dying.push({ p: cl.piece, i: cl.i, t: 0 });
      g.fx.sparkle(this.px(cl.i), this.py(cl.i), Pal.GOLD, 24, cell * 1.5, cell * 0.3);
      g.fx.text('+1000', this.px(cl.i), this.py(cl.i) - cell * 0.6, 20 * dp, 0xFFFFE08A);
    }
    r.crystals.forEach((cfx, k) => {
      const x0 = this.px(cfx.i), y0 = this.py(cfx.i);
      g.fx.at(cfx.delay + 0.03, () => {
        const s2 = g.sprites; if (!s2) return;
        this.flyers.push({ bm: s2.crystalBig, x0, y0, x1: this.crystalIcon[0], y1: this.crystalIcon[1], t: 0, dur: 0.5 + rng.nextFloat() * 0.2 });
        g.fx.sparkle(x0, y0, 0xFF8FE3F0, 6, cell * 0.6, cell * 0.2);
        if (k < 6) g.audio.noteRaw(10 + (k % 5), 0.35);
      });
    });
    for (const bf of r.bonuses) g.fx.at(bf.delay, () => this.applyBonus(bf));
    for (const f of r.fires) g.fx.at(f.delay, () => {
      const src = this.totemRect[f.steel ? 4 : 0];
      this.fires.push({ x0: src.cx, y0: src.cy, x1: this.px(f.to), y1: this.py(f.to), t: 0, steel: f.steel });
      g.audio.play('fly', 0.5, f.steel ? 0.7 : 1.2);
    });
    for (const gi of r.gifts) { this.giftGlow.push([gi, 0]); g.fx.sparkle(this.px(gi), this.py(gi), Pal.GOLD, 12, cell, cell * 0.3); }
    if (r.gifts.length) g.audio.play('create', 0.7);
    if (sn > 0 && pts > 0) g.fx.text('+' + pts, sx / sn, sy / sn, (18 + Math.min(r.cascade, 5) * 2) * dp, Pal.light[r.matchColors.length ? clamp(r.matchColors[0], 0, 5) : 0], 0.9);
    else if (pts > 0 && r.clears.length) g.fx.text('+' + pts, this.px(r.clears[0].i), this.py(r.clears[0].i), 20 * dp, 0xFFFFFFFF);
    const word = ({ 3: 'Браво!', 5: 'Бис!', 7: 'Фортиссимо!', 9: 'Виртуоз!' })[r.cascade];
    if (word && !this.finale) { g.fx.text(word, g.W / 2, this.oy + cell * board.h * 0.45, 44 * dp, 0xFFD9434B, 1.2, true); g.audio.play('star', 0.5); }
    const t = r.maxDelay() + 0.16;
    this.clearTimer = this.ph === PH_CLEAR ? Math.max(this.clearTimer, t) : t;
    this.ph = PH_CLEAR; this.phT = 0;
  }

  applyBonus(bf) {
    const g = this.g, x = this.px(bf.i), y = this.py(bf.i), board = this.board;
    const v = Meta.bonusDef(bf.kind).values[clamp(board.bonusPower[bf.kind] - 1, 0, 3)];
    switch (bf.kind) {
      case BN_TIME: this.addFlask(v / 100); g.fx.text('Крещендо +' + v + '%', x, y, 20 * g.dp, 0xFF3A72C0, 1.1); g.audio.play('star', 0.6, 0.8); break;
      case BN_MULT: this.multMoves += v; g.fx.text('Очки ×2!', x, y, 24 * g.dp, Pal.GOLD, 1.1); g.audio.play('create', 0.6); break;
      case BN_STAR: this.earnStar(v, x, y); break;
      case BN_CRYST: {
        const s2 = g.sprites; if (!s2) return;
        for (let k = 0; k < v; k++) this.flyers.push({ bm: s2.crystalBig, x0: x + (k - v / 2) * this.cell * 0.3, y0: y, x1: this.crystalIcon[0], y1: this.crystalIcon[1], t: -k * 0.06, dur: 0.6 });
        g.fx.text('+' + v, x, y, 22 * g.dp, 0xFF2FA7C9, 1.0);
        g.audio.play('collect', 0.6); break;
      }
      case BN_TNT: g.fx.text('Бум!', x, y, 22 * g.dp, 0xFFD9434B, 0.8); break;
      case BN_LIGHT: g.audio.play('zap', 0.8); break;
      case BN_TUNE: g.fx.text('Камертон!', x, y, 22 * g.dp, Pal.base[clamp(bf.color, 0, 5)], 1.0); break;
    }
  }
  startFrenzy() {
    const g = this.g;
    this.flask = 1; this.frenzyMoves = 5;
    g.fx.text('ФОРТИССИМО!', g.W / 2, this.oy + this.cell * this.board.h * 0.4, 46 * g.dp, Pal.GOLD, 1.6, true);
    g.fx.text('5 ходов: очки ×2 и звёзды', g.W / 2, this.oy + this.cell * this.board.h * 0.4 + 40 * g.dp, 17 * g.dp, 0xFFFFFFFF, 1.6);
    g.audio.play('win', 0.6); g.vibe(40);
  }
  addFlask(f) { if (this.frenzyMoves > 0) return; this.flask += f; if (this.flask >= 1) this.startFrenzy(); }
  resolveTotems() {
    if (!this.turnHadMatch) { this.prevColors = new Set(); return; }
    let fire = -1;
    for (const c of this.curColors) if (this.prevColors.has(c) && this.totemReady(c)) { fire = c; break; }
    this.prevColors = new Set(this.curColors);
    if (fire >= 0) { this.pendingTotem = fire; this.prevColors.delete(fire); }
    if (this.frenzyMoves > 0) this.earnStar(1, this.flaskRect.cx, this.flaskRect.t);
  }
  runTotem(c) {
    const g = this.g, board = this.board;
    this.charge[c] = 0; this.totemFlash[c] = 1.5;
    const t = Meta.totems[c], v = t.values[this.totemLvl[c] - 1], r = this.totemRect[c];
    g.fx.text(t.name + '!', g.W / 2, this.oy + this.cell * board.h * 0.42, 40 * g.dp, Pal.base[c], 1.4, true);
    g.fx.burst(r.cx, r.cy, Pal.base[c], 24, this.cell * 5, this.cell * 0.1);
    g.audio.play('bomb', 0.7); g.vibe(35);
    board.beginTurn();
    switch (c) {
      case 0: return board.totemFire(v);
      case 1: this.addFlask(v / 100); g.fx.text('Крещендо +' + v + '%', g.W / 2, this.hudTop + this.hudH + 16 * g.dp, 17 * g.dp, 0xFF3A72C0, 1.6); return null;
      case 2: this.multMoves += v; g.fx.text('Очки ×2 на ' + v + ' ход.', g.W / 2, this.hudTop + this.hudH + 16 * g.dp, 17 * g.dp, Pal.GOLD, 1.6); return null;
      case 3: return board.totemCrystals(v);
      case 4: { const res = board.totemSteel(v); return res.fires.length === 0 ? board.totemFire(Math.max(2, (v / 2) | 0)) : res; }
      default: return board.totemGifts(v);
    }
  }
  endTurn() {
    const g = this.g, board = this.board;
    if (this.finale) {
      this.finaleRounds++;
      if (board.specialCount() > 0 && this.finaleRounds < 30) { const r = board.detonateAll(); if (r) { this.play(r); return; } }
      this.win(); return;
    }
    const cc = this.toolTurn ? -1 : board.spreadChoc();
    this.toolTurn = false;
    if (cc >= 0) {
      this.chocGrow.push([cc, 0]);
      g.audio.play('choc', 0.6);
      g.fx.burst(this.px(cc), this.py(cc), 0xFF8A1040, 10, this.cell * 3, this.cell * 0.1);
    }
    if (this.pendingTotem >= 0) {
      const c = this.pendingTotem; this.pendingTotem = -1;
      const r = this.runTotem(c);
      if (r && (r.clears.length || r.blocks.length || r.crystals.length || r.gifts.length)) { this.play(r); return; }
    }
    if (this.mode === MODE_CAMPAIGN && this.spec.goalDone(board)) { this.movesAtGoal = this.movesUsed; if (this.par2 - this.movesUsed > 0) this.startFinale(); else this.win(); return; }
    if (this.moveBudget > 0 && this.movesUsed >= this.moveBudget) { this.finishMode(); return; }
    if (board.findMoves().length === 0) { this.doShuffle(); return; }
    this.ph = PH_IDLE; this.idleT = 0;
  }
  startFinale() {
    const g = this.g;
    this.finale = true; this.finaleT = 0.9; this.finaleNote = 0;
    this.ph = PH_FINALE; this.phT = 0;
    g.fx.text('Финал!', g.W / 2, this.oy + this.cell * this.board.h * 0.45, 54 * g.dp, Pal.GOLD, 1.6, true);
    g.fx.text('сэкономленные ходы превращаются в очки', g.W / 2, this.oy + this.cell * this.board.h * 0.45 + 42 * g.dp, 15 * g.dp, 0xFFFFFFFF, 1.6);
    g.audio.play('win', 0.6);
  }
  doShuffle() {
    const g = this.g;
    this.board.shuffle();
    this.ph = PH_SHUFFLE; this.phT = 0;
    g.fx.text('Нет ходов — перемешиваем!', g.W / 2, this.oy + this.cell * this.board.h / 2, 26 * g.dp, 0xFFFFFFFF, 1.3, true);
    g.audio.play('shuffle', 0.8);
  }
  computeStars() { return this.movesAtGoal <= this.par3 ? 3 : this.movesAtGoal <= this.par2 ? 2 : 1; }
  win() {
    const g = this.g, prog = this.prog, spec = this.spec;
    this.ph = PH_END;
    const stars = this.computeStars(), before = prog.stars(spec.num);
    prog.recordWin(spec.num, stars, this.board.score);
    const gain = this.starsEarned + Math.max(0, stars - before);
    prog.addStars(gain);
    if (prog.streakOpen) prog.streak = prog.streak + 1;
    g.fx.at(0.5, () => { this.overlay = new WinOverlay(this, stars, gain); g.audio.play('win', 0.8); });
    for (let k = 0; k < 6; k++) g.fx.at(k * 0.12, () => g.fx.burst(g.W * (0.2 + 0.12 * k), this.oy + this.cell * this.board.h * 0.4, Pal.base[k], 22, this.cell * 7, this.cell * 0.1));
  }
  finishMode() {
    const g = this.g, prog = this.prog, board = this.board;
    this.ph = PH_END;
    let gain;
    if (this.mode === MODE_BONUS) {
      gain = this.spec.bonusLevel === 0 ? this.starsEarned + 2 : this.spec.bonusLevel === 1 ? this.starsEarned + ((board.crystalsCollected / 4) | 0) : this.starsEarned + ((board.score / 2500) | 0);
      if (prog.bonusPlayed(this.stage)) gain = Math.max(1, (gain / 3) | 0);
    } else if (this.mode === MODE_ENDLESS) gain = this.starsEarned + ((board.crystalsCollected / 10) | 0);
    else gain = this.starsEarned + ((board.crystalsCollected / 6) | 0);
    prog.addStars(gain);
    if (this.mode === MODE_BONUS) prog.setBonusPlayed(this.stage);
    if (this.mode === MODE_ENDLESS) prog.setModeBest('endless', board.score);
    if (this.mode === MODE_ARCADE) prog.setModeBest('arcade', board.score);
    g.audio.play('win', 0.7);
    this.overlay = new ResultOverlay(this, gain);
  }
  openPause() { if (!this.overlay && this.ph !== PH_END) this.overlay = new PauseOverlay(this); }

  // ---------------- update ----------------
  animatePieces(dt) {
    let moving = false;
    const board = this.board;
    for (let i = 0; i < board.n; i++) {
      const p = board.pieces[i]; if (!p) continue;
      if (p.appear < 1) p.appear = Math.min(1, p.appear + dt / 0.28);
      if (p.squash > 0) p.squash = Math.max(0, p.squash - dt * 5);
      if (p.path.length === 0) continue;
      moving = true;
      p.speed = Math.min(p.speed + 58 * dt, 21);
      let step = p.speed * dt;
      while (step > 0 && p.path.length) {
        const t = p.path[0], tx = board.cx(t), ty = board.cy(t), dx = tx - p.vx, dy = ty - p.vy, d = Math.hypot(dx, dy);
        if (d <= step) {
          p.vx = tx; p.vy = ty; step -= d; p.path.shift();
          if (p.path.length === 0) { p.squash = Math.min(1, p.speed / 12); p.speed = 0; }
        } else { p.vx += dx / d * step; p.vy += dy / d * step; step = 0; }
      }
    }
    return moving;
  }

  update(dt) {
    const g = this.g, board = this.board, cell = this.cell;
    g.fx.update(dt);
    this.phT += dt;
    for (let c = 0; c < 6; c++) if (this.totemFlash[c] > 0) this.totemFlash[c] = Math.max(0, this.totemFlash[c] - dt);
    for (let i = 0; i < board.n; i++) if (this.wobble[i] > 0) this.wobble[i] = Math.max(0, this.wobble[i] - dt);
    if (this.totemTipT > 0) this.totemTipT -= dt;
    this.shownScore += (board.score - this.shownScore) * Math.min(1, dt * 8);
    if (Math.abs(board.score - this.shownScore) < 1) this.shownScore = board.score;
    this.dying = this.dying.filter(d => { d.t += dt; if (d.t > 0 && d.t - dt <= 0) this.burstFor(d); return d.t <= 0.26; });
    this.flyers = this.flyers.filter(f => (f.t += dt) < f.dur);
    this.chocGrow = this.chocGrow.filter(c => (c[1] += dt) <= 0.4);
    this.giftGlow = this.giftGlow.filter(c => (c[1] += dt) <= 1.2);
    for (const pj of this.projs) {
      pj.t += dt;
      const q = this.projPos(pj);
      if (Math.random() < 0.8) g.fx.sparkle(q[0], q[1], Pal.light[pj.color], 1, cell * 0.3, cell * 0.18);
    }
    this.projs = this.projs.filter(p => p.t < FLY_T);
    for (const f of this.fires) {
      f.t += dt;
      const q = this.firePos(f);
      g.fx.sparkle(q[0], q[1], f.steel ? 0xFFA9C8EE : 0xFFFF9A3C, 1, cell * 0.3, cell * 0.25);
      if (f.t >= 0.4) g.fx.burst(f.x1, f.y1, f.steel ? 0xFF3A72C0 : 0xFFE98638, 12, cell * 4, cell * 0.09);
    }
    this.fires = this.fires.filter(f => f.t < 0.4);
    if (this.overlay) this.overlay.update(dt);
    const moving = this.animatePieces(dt);

    switch (this.ph) {
      case PH_INTRO: if (!moving && this.phT > 0.9) this.ph = PH_IDLE; break;
      case PH_IDLE: {
        this.idleT += dt;
        const hintDelay = this.spec.num <= 3 ? 2.5 : 6;
        if (!this.hint && this.idleT > hintDelay && !this.overlay) { const ms = board.findMoves(); this.hint = ms.length ? ms.reduce((a, c) => c.value > a.value ? c : a) : null; }
        break;
      }
      case PH_SWAP: case PH_SWAPBACK: {
        const dur = 0.14, t = Math.min(1, this.phT / dur), e = t * t * (3 - 2 * t);
        const a = board.pieces[this.swapA], b = board.pieces[this.swapB];
        const ax = board.cx(this.swapA), ay = board.cy(this.swapA), bx = board.cx(this.swapB), by = board.cy(this.swapB);
        const f = this.ph === PH_SWAP ? e : 1 - e;
        if (a) { a.vx = ax + (bx - ax) * f; a.vy = ay + (by - ay) * f; }
        if (b) { b.vx = bx + (ax - bx) * f; b.vy = by + (ay - by) * f; }
        if (t >= 1) {
          if (this.ph === PH_SWAPBACK) { this.ph = PH_IDLE; this.idleT = 0; }
          else if (this.swapKind === 0) { this.ph = PH_SWAPBACK; this.phT = 0; g.audio.play('bad', 0.55); }
          else {
            const ca = a ? a.color : -1, cb = b ? b.color : -1;
            board.doSwap(this.swapA, this.swapB);
            this.beginPlayerTurn();
            board.beginTurn();
            const r = this.swapKind === 2 ? board.comboSwap(this.swapA, this.swapB) : board.clearPhase([this.swapB, this.swapA]);
            if (this.swapKind === 2) { if (ca >= 0 && ca <= 5) this.curColors.add(ca); if (cb >= 0 && cb <= 5) this.curColors.add(cb); }
            if (r) { this.play(r, true); this.resolveTotems(); } else this.endTurn();
          }
        }
        break;
      }
      case PH_CLEAR:
        this.clearTimer -= dt;
        if (this.clearTimer <= 0) { board.gravity(); this.ph = PH_FALL; this.phT = 0; }
        break;
      case PH_FALL:
        if (!moving && this.phT > 0.04) {
          const r = board.clearPhase(this.pendingPref); this.pendingPref = null;
          if (r) this.play(r); else this.endTurn();
        }
        break;
      case PH_SHUFFLE:
        if (!moving && this.phT > 0.3) { const r = board.clearPhase(null); if (r) this.play(r); else { this.ph = PH_IDLE; this.idleT = 0; } }
        break;
      case PH_FINALE:
        this.finaleT -= dt;
        if (this.finaleT <= 0) {
          if (this.finaleNote < Math.min(15, this.par2 - this.movesAtGoal)) {
            board.score += 150;
            const i = board.randomNormalCell();
            if (i >= 0) {
              const p = board.pieces[i];
              p.kind = this.rng.nextBoolean() ? STRIPE_H : STRIPE_V;
              p.appear = 0.3;
              board.score += 300;
              g.fx.sparkle(this.px(i), this.py(i), Pal.light[p.color], 10, cell, cell * 0.3);
              g.fx.text('+450', this.px(i), this.py(i), 16 * g.dp, 0xFFFFFFFF, 0.7);
            }
            g.audio.noteRaw(Math.min(14, this.finaleNote++), 0.6);
            this.finaleT = 0.12;
          } else {
            const r = board.detonateAll();
            if (r) this.play(r); else this.win();
          }
        }
        break;
    }
  }
  burstFor(d) {
    const g = this.g, x = this.px(d.i), y = this.py(d.i), p = d.p;
    if (p.kind === INGR) return;
    const col = p.kind === BOMB ? 0xFFFFFFFF : Pal.base[p.color];
    g.fx.burst(x, y, col, 9, this.cell * 4.5, this.cell * 0.075);
    if (Math.random() < 0.5) g.fx.notes(x, y, p.kind === BOMB ? 0xFFFFFFFF : Pal.light[p.color], 1, this.cell * 1.6, this.cell * 0.28);
  }
  projPos(pj) {
    const t = clamp(pj.t / FLY_T, 0, 1), e = t * t * (3 - 2 * t);
    const mx = (pj.x0 + pj.x1) / 2, my = Math.min(pj.y0, pj.y1) - this.cell * 1.6, u = 1 - e;
    return [u * u * pj.x0 + 2 * u * e * mx + e * e * pj.x1, u * u * pj.y0 + 2 * u * e * my + e * e * pj.y1];
  }
  firePos(f) {
    const t = clamp(f.t / 0.4, 0, 1), e = t * t;
    const mx = (f.x0 + f.x1) / 2 + (f.x1 - f.x0) * 0.2, my = Math.min(f.y0, f.y1) - this.cell * 2, u = 1 - e;
    return [u * u * f.x0 + 2 * u * e * mx + e * e * f.x1, u * u * f.y0 + 2 * u * e * my + e * e * f.y1];
  }
  drawProjs(c) {
    const sp = this.g.sprites; if (!sp) return;
    for (const pj of this.projs) {
      const t = clamp(pj.t / FLY_T, 0, 1), q = this.projPos(pj);
      const s = this.cell * (1 + 0.35 * Math.sin(t * PI)) * 0.5, gs = s * 1.8;
      drawImg(c, tinted(sp.glow, Pal.light[pj.color]), q[0] - gs, q[1] - gs, q[0] + gs, q[1] + gs, 170 / 255);
      c.save(); rotAt(c, Math.sin(pj.t * 40) * 12, q[0], q[1]);
      if (pj.carry) drawImg(c, pj.carry, q[0] - s * 0.8, q[1] + s * 0.1, q[0] + s * 0.8, q[1] + s * 1.7);
      const flap = 1 + 0.12 * Math.sin(pj.t * 55);
      drawImg(c, pj.bm, q[0] - s * flap, q[1] - s, q[0] + s * flap, q[1] + s);
      c.restore();
    }
    for (const f of this.fires) {
      const q = this.firePos(f), s = this.cell * 0.55;
      drawImg(c, f.steel ? sp.steel : sp.fire, q[0] - s, q[1] - s, q[0] + s, q[1] + s);
    }
  }

  // ---------------- draw ----------------
  draw(c) {
    const g = this.g, cell = this.cell, br = this.boardRect;
    g.drawBackground(c, 0, 0);
    c.save();
    if (g.fx.shake > 0) c.translate((Math.random() - 0.5) * g.fx.shake * cell * 0.22, (Math.random() - 0.5) * g.fx.shake * cell * 0.22);
    this.drawBoard(c);
    if (this.frenzyMoves > 0) {
      const a = clamp(120 + 100 * Math.sin(g.time * 8), 0, 255);
      strokeP(c, rrect(br.l - cell * 0.22, br.t - cell * 0.22, br.r + cell * 0.22, br.b + cell * 0.22, cell * 0.3), css(withA(Pal.GOLD, a)), cell * 0.12);
    }
    g.fx.draw(c);
    this.drawProjs(c);
    c.restore();
    this.drawHud(c);
    this.drawFlask(c);
    this.drawTotems(c);
    this.drawTools(c);
    for (const b of this.bar.list) b.draw(c);
    this.drawTotemTip(c);
    for (const f of this.flyers) {
      if (f.t < 0) continue;
      const t = f.t / f.dur, e = t * t;
      const x = f.x0 + (f.x1 - f.x0) * e, y = f.y0 + (f.y1 - f.y0) * e - Math.sin(t * PI) * cell * 1.2, s = cell * (0.75 - 0.35 * t);
      drawImg(c, f.bm, x - s / 2, y - s / 2, x + s / 2, y + s / 2);
    }
    if (this.finale && this.ph !== PH_END) {
      const a = clamp(170 + 80 * Math.sin(g.time * 4), 0, 255) | 0;
      Ui.txt(c, 'Коснитесь, чтобы пропустить ▸▸', g.W / 2, br.b + 22 * g.dp, 16 * g.dp, 0xFFFFFFFF, Pal.INK, 'center', a);
    }
    const o = this.overlay;
    if (o) { c.fillStyle = css(0xFF000000, Math.min(1, o.t * 5) * 170 / 255); c.fillRect(0, 0, g.W, g.H); o.draw(c); }
  }

  /** Union of rounded cells as a mask canvas in board-bitmap coordinates. */
  cellsMask(w, h, grow, rad, mode, lineW) {

      const px = m + board.cx(i) * cell, py = m + board.cy(i) * cell;
      rrectPath(paths, px - grow, py - grow, px + cell + grow, py + cell + grow, rad);
      // bridge neighbours so the union has straight edges instead of notches between rounded cells
      const right = board.cx(i) + 1 < board.w && board.mask[i + 1], down = board.cy(i) + 1 < board.h && board.mask[i + board.w];

  buildBoardBg() {

        let xx = ox - fpad;

      for (let i = 0; i < board.n; i++) if (board.mask[i]) {
        const px = ox + board.cx(i) * cell, py = oy + board.cy(i) * cell;
        if (board.cx(i) + 1 < board.w && board.mask[i + 1]) line(x, px + cell, py, px + cell, py + cell, css(0x332B211C), cell * 0.012);
        if (board.cy(i) + 1 < board.h && board.mask[i + board.w]) line(x, px, py + cell, px + cell, py + cell, css(0x332B211C), cell * 0.012);

  drawBoard(c) {

  drawPiece(c, sp, p, vx, vy, selected) {

    if (this.mode === MODE_CAMPAIGN) items.push([-4, Math.min(cr, spec.crystalGoal) + '/' + spec.crystalGoal, cr >= spec.crystalGoal]);
    else items.push([-4, '' + cr, false]);
    if (this.mode === MODE_CAMPAIGN) {
      if (spec.goal === G_JELLY) items.push([-2, '' + board.jellyLeft(), board.jellyLeft() === 0]);
      else if (spec.goal === G_INGR) { const left = Math.max(0, spec.ingrTotal - board.ingrCollected); items.push([-3, '' + left, left === 0]); }
      else if (spec.goal === G_COLLECT) spec.collectColors.forEach((col, k) => { const left = Math.max(0, spec.collectCounts[k] - board.collected[col]); items.push([col, '' + left, left === 0]); });
      else if (spec.goal === G_ORGAN) { const left = Math.max(0, spec.organGoal - board.organNotes); items.push([-5, '' + left, left === 0]); }
    }
    const slot = gr.w / items.length;
    items.forEach(([type, text, done], k) => {
      const tw = Ui.measure(c, text, isz * 0.55);
      const wTot = isz + 4 * dp + (done ? isz * 0.6 : tw);
      const cx = gr.l + slot * k + (slot - wTot) / 2 + isz / 2;
      if (type === -4) { drawImg(c, sp.crystalBig, cx - isz * 0.55, gy - isz * 0.55, cx + isz * 0.55, gy + isz * 0.55); this.crystalIcon = [cx, gy]; }
      else if (type === -2) Ui.jellyIcon(c, cx, gy, isz * 0.42);
      else if (type === -5) drawImg(c, sp.organ, cx - isz * 0.55, gy - isz * 0.55, cx + isz * 0.55, gy + isz * 0.55);
      else if (type === -3) drawImg(c, sp.ingr, cx - isz / 2, gy - isz / 2, cx + isz / 2, gy + isz / 2);
      else drawImg(c, sp.icon[type], cx - isz / 2, gy - isz / 2, cx + isz / 2, gy + isz / 2);
      if (type >= 0 || type === -5) this.goalIconPos.push([cx, gy]);
      if (done) Ui.check(c, cx + isz * 0.85, gy, isz * 0.28);
      else Ui.txt(c, text, cx + isz * 0.55 + 4 * dp, gy, isz * 0.55, 0xFFFFFFFF, 0xFF2B211C, 'left');
    });
    const y2 = gr.t + hudH * 0.76;
    Ui.txt(c, '' + Math.floor(this.shownScore), gr.l + 14 * dp, y2, hudH * 0.19, 0xFFFFFFFF, 0xFF2B211C, 'left');
    let bx = gr.r - 14 * dp;
    const se = '★+' + this.starsEarned;
    Ui.txt(c, se, bx, y2, hudH * 0.18, Pal.GOLD, 0xFF2B211C, 'right');
    bx -= Ui.measure(c, se, hudH * 0.18) + 10 * dp;
    if (this.scoreMult > 1) Ui.txt(c, '×' + this.scoreMult, bx, y2, hudH * 0.2 * (1 + 0.08 * Math.sin(g.time * 9)), 0xFFFFD34A, 0xFF2B211C, 'right');
  }
  drawFlask(c) {
    const g = this.g, r = this.flaskRect, rad = r.h / 2;
    fillP(c, rrect(r.l, r.t, r.r, r.b, rad), css(0xCC1D3150));
    const f = this.frenzyMoves > 0 ? this.frenzyMoves / 5 : clamp(this.flask, 0, 1);
    if (f > 0) {
      let style;
      if (this.frenzyMoves > 0) {
        const grd = c.createLinearGradient(r.l, 0, r.r, 0), seg = r.w * 0.3, phase = (g.time * 300) % (seg * 2);
        const stops = [];
        for (let k = -2; k * seg <= r.w + seg * 2; k++) { const x = phase + k * seg; stops.push([x / r.w, k % 2 === 0 ? Pal.GOLD : 0xFFFFF4C0]); }
        let any = false;
        for (const [t, col] of stops) if (t >= 0 && t <= 1) { grd.addColorStop(t, css(col)); any = true; }
        if (!any) grd.addColorStop(0, css(Pal.GOLD));
        style = grd;
      } else style = linGrad(c, r.l, 0, r.r, 0, [0xFF3A72C0, Pal.GOLD]);
      fillP(c, rrect(r.l + 2 * g.dp, r.t + 2 * g.dp, r.l + 2 * g.dp + (r.w - 4 * g.dp) * f, r.b - 2 * g.dp, rad), style);
    }
    strokeP(c, rrect(r.l, r.t, r.r, r.b, rad), css(0xFFDDA54C), 2 * g.dp);
    const label = this.frenzyMoves > 0 ? 'ФОРТИССИМО · ещё ' + this.frenzyMoves + ' ход.' : 'Крещендо';
    Ui.txt(c, label, r.cx, r.cy - 1 * g.dp, r.h * 0.72, 0xFFFFFFFF);
    if (this.combo >= 2) Ui.txt(c, '×' + this.combo, r.l + 8 * g.dp, r.cy, r.h * 0.8, Pal.GOLD, 0xFF2B211C, 'left');
  }
  drawTotems(c) {
    const g = this.g, sp = g.sprites; if (!sp) return;
    for (let k = 0; k < 6; k++) {
      const r = this.totemRect[k], lvl = this.totemLvl[k], cx = r.cx, cy = r.cy, rr = r.w / 2, ready = this.totemReady(k);
      if (ready) { const gs = rr * (1.5 + 0.15 * Math.sin(g.time * 6 + k)); drawImg(c, tinted(sp.glow, Pal.base[k]), cx - gs, cy - gs, cx + gs, cy + gs, 200 / 255); }
      const pulse = 1 + 0.18 * Math.min(1, this.totemFlash[k]) * Math.abs(Math.sin(this.totemFlash[k] * 12));
      const s = rr * pulse;
      drawImg(c, lvl > 0 ? sp.totem[k] : sp.totemLocked[k], cx - s, cy - s, cx + s, cy + s, lvl > 0 ? 1 : 200 / 255);
      if (lvl > 0) {
        const need = Meta.totemCharge[lvl - 1], f = clamp(this.charge[k] / need, 0, 1);
        strokeP(c, circlePath(cx, cy, rr * 1.06), css(0x552B211C), rr * 0.16, 'round');
        if (f > 0) { const a = new Path2D(); a.arc(cx, cy, rr * 1.06, -PI / 2, -PI / 2 + PI * 2 * f); strokeP(c, a, css(ready ? Pal.GOLD : Pal.base[k]), rr * 0.16, 'round'); }
        if (ready && this.prevColors.has(k)) {
          const pr = rr * 0.24 * (1 + 0.2 * Math.sin(g.time * 10));
          fillP(c, circlePath(r.r - rr * 0.1, r.t + rr * 0.1, pr), css(Pal.GOLD));
          Ui.txt(c, '!', r.r - rr * 0.1, r.t + rr * 0.1, pr * 1.6, Pal.INK, 0);
        }
        for (let j = 0; j < lvl; j++) fillP(c, circlePath(cx + (j - (lvl - 1) / 2) * rr * 0.32, r.b + rr * 0.22, rr * 0.09), css(Pal.GOLD));
      }
    }
  }
  drawTotemTip(c) {
    const g = this.g;
    if (this.totemTipT > 0 && this.totemTip >= 0) {
      const k = this.totemTip, t = Meta.totems[k], lvl = this.totemLvl[k], lines = [];
      if (lvl === 0) { lines.push('Тотем «' + t.name + '»'); lines.push('Откроется на уровне ' + t.unlock); }
      else {
        lines.push(t.name + ' · ур. ' + lvl);
        lines.push(t.power.split(':')[0] + ': ' + t.values[lvl - 1] + ' ' + t.unit);
        lines.push(this.totemReady(k) ? 'Заряжен! Два хода подряд этим цветом' : 'Заряд ' + Math.floor(this.charge[k]) + '/' + Meta.totemCharge[lvl - 1] + ' фишек');
      }
      const w = g.W * 0.8, lh = 20 * g.dp;
      const bottom = this.toolRect[0].t - 10 * g.dp;
      const box = new R((g.W - w) / 2, bottom - lh * lines.length - 18 * g.dp, (g.W + w) / 2, bottom);
      Ui.panel(c, box, 14 * g.dp, Math.floor(255 * Math.min(1, this.totemTipT * 3)));
      lines.forEach((l, j) => Ui.txt(c, l, box.cx, box.t + 18 * g.dp + j * lh, j === 0 ? 16 * g.dp : 14 * g.dp, j === 0 ? Pal.light[k] : 0xFFFFFFFF, 0xFF2B211C, 'center', 255, j === 0 ? BOLD : MEDIUM));
    }
  }

  // ---------------- input ----------------
  touch(action, x, y) {
    const g = this.g, board = this.board;
    if (this.overlay) { this.overlay.touch(action, x, y); return; }
    if (action === T_DOWN) {
      if (this.bar.down(x, y)) return;
      for (let k = 0; k < 6; k++) if (this.totemRect[k].contains(x, y)) { this.totemTip = k; this.totemTipT = 2.8; g.audio.play('tick', 0.4); return; }
      for (let k = 0; k < 4; k++) { const r = this.toolRect[k], m = 6 * g.dp; if (x >= r.l - m && x <= r.r + m && y >= r.t - m && y <= r.b + m) { this.pressTool(k); return; } }
      this.downCell = -1;
      if (this.finale && this.ph !== PH_END) { this.skipFinale(); return; }
      if (!this.canPlay()) return;
      const cIdx = this.cellAt(x, y);
      if (this.toolMode >= 0) { if (this.ph === PH_IDLE) { if (cIdx >= 0) this.useToolAt(cIdx); else this.toolMode = -1; } this.dragDone = true; return; }
      if (cIdx >= 0 && board.movable(cIdx) && (this.ph === PH_IDLE || this.settled(cIdx))) { this.downCell = cIdx; this.downX = x; this.downY = y; this.dragDone = false; this.idleT = 0; this.hint = null; }
      else if (cIdx >= 0) {
        this.wobble[cIdx] = 0.35; g.vibe(8); g.audio.play('tick', 0.4, 0.7);
        const tip = this.blockerTip(cIdx);
        if (tip) g.fx.text(tip, g.W / 2, this.py(cIdx) - this.cell * 0.9, 15 * g.dp, 0xFFFFFFFF, 1.4);
      }
    } else if (action === T_MOVE) {
      this.bar.move(x, y);
      if (this.downCell < 0 || this.dragDone || !this.canPlay()) return;
      const dx = x - this.downX, dy = y - this.downY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > this.cell * 0.32) {
        this.dragDone = true;
        const nx = board.cx(this.downCell) + (Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0);
        const ny = board.cy(this.downCell) + (Math.abs(dy) >= Math.abs(dx) ? Math.sign(dy) : 0);
        if (board.inb(nx, ny)) this.trySwap(this.downCell, board.idx(nx, ny));
      }
    } else {
      if (this.bar.up(x, y)) return;
      if (this.downCell >= 0 && !this.dragDone && this.canPlay()) {
        const cIdx = this.downCell;
        if (this.sel >= 0 && this.sel !== cIdx && this.adjacent(this.sel, cIdx)) this.trySwap(this.sel, cIdx);
        else if (this.sel < 0 && board.isSpecialAt(cIdx)) this.tapSpecial(cIdx);
        else { this.sel = this.sel === cIdx ? -1 : cIdx; if (this.sel >= 0) { g.audio.play('tick', 0.5); this.wobble[cIdx] = 0.2; } }
      }
      this.downCell = -1;
    }
  }
  back() {
    const o = this.overlay;
    if (o instanceof PauseOverlay) { this.overlay = null; return true; }
    if (o) return true;
    if (this.toolMode >= 0) { this.toolMode = -1; return true; }
    this.openPause(); return true;
  }
  onPauseApp() { if (!this.overlay && this.ph !== PH_END) this.overlay = new PauseOverlay(this); }
  nextAfterWin() {
    const st = Meta.stageOf(this.spec.num);
    return (this.spec.num % Meta.STAGE_LEN === 0 && !this.prog.bonusPlayed(st)) ? new MapScene(this.g, -1, st) : new MapScene(this.g, this.spec.num + 1);
  }
}

// ---------------- overlays ----------------
class Overlay {
  constructor(L) { this.L = L; this.g = L.g; this.t = 0; this.btns = new BtnSet(L.g); }
  update(dt) { this.t += dt; }
  touch(a, x, y) { if (a === T_DOWN) this.btns.down(x, y); else if (a === T_MOVE) this.btns.move(x, y); else this.btns.up(x, y); }
  panelRect(wf, hf) { const g = this.g, w = g.W * wf, h = g.H * hf; return new R((g.W - w) / 2, (g.H - h) / 2, (g.W + w) / 2, (g.H + h) / 2); }
  scaleIn(c, r) {
    let k = 1;
    if (this.t < 0.3) { const e = this.t / 0.3; k = 0.6 + 0.4 * (1 - (1 - e) * (1 - e)) + Math.sin(e * PI) * 0.08; }
    c.translate(r.cx, r.cy); c.scale(k, k); c.translate(-r.cx, -r.cy);
  }
  title(c, r, s) { Ui.gradTxt(c, s, r.cx, r.t + 44 * this.g.dp, 32 * this.g.dp, 0xFFFFFFFF, 0xFFFFC94A, 0xFF2B211C); }
  stack(r, top, labels) {
    const bw = r.w * 0.72, bh = r.h * 0.11, x0 = r.cx - bw / 2;
    let y = top;
    for (const [l, col, a] of labels) { this.btns.add(new Btn(new R(x0, y, x0 + bw, y + bh), l, col[0], col[1], a)); y += bh * 1.28; }
  }
}

class PauseOverlay extends Overlay {
  constructor(L) {
    super(L);
    const g = this.g, prog = g.prog;
    this.r = this.panelRect(0.82, 0.52);
    const exitLabel = L.mode === MODE_ENDLESS ? 'Завершить и забрать звёзды' : L.mode === MODE_CAMPAIGN ? 'Выйти на карту' : 'Выйти';
    this.stack(this.r, this.r.t + this.r.h * 0.22, [
      ['Продолжить', GREEN, () => { L.overlay = null; }],
      ['', GREY, () => { prog.sound = !prog.sound; }],
      ['', GREY, () => { prog.music = !prog.music; if (prog.music) g.audio.resumeMusic(); else g.audio.applyMusic(); }],
      [exitLabel, WOOD, () => {
        if (L.mode === MODE_ENDLESS) { L.overlay = null; L.finishMode(); }
        else { prog.addStars(L.starsEarned); if (L.mode === MODE_CAMPAIGN && L.movesUsed > 0) prog.streak = 0; g.go(new MapScene(g, -1)); }
      }],
    ]);
  }
  draw(c) {
    const prog = this.g.prog;
    this.btns.list[1].label = prog.sound ? 'Звуки: вкл' : 'Звуки: выкл';
    this.btns.list[2].label = prog.music ? 'Музыка: вкл' : 'Музыка: выкл';
    c.save(); this.scaleIn(c, this.r);
    Ui.panel(c, this.r, 26 * this.g.dp);
    this.title(c, this.r, 'Пауза');
    this.btns.draw(c);
    c.restore();
  }
}

class WinOverlay extends Overlay {
  constructor(L, stars, gain) {
    super(L);
    const g = this.g;
    this.stars = stars; this.gain = gain; this.shown = 0;
    this.r = this.panelRect(0.86, 0.58);
    this.stack(this.r, this.r.t + this.r.h * 0.56, [
      ['Далее', GREEN, () => g.go(L.nextAfterWin())],
      ['Мастерская', WOOD, () => g.go(new ShopScene(g, L.spec.num + 1))],
      ['Карта', GREY, () => g.go(new MapScene(g, -1))],
    ]);
  }
  update(dt) {
    super.update(dt);
    const g = this.g;
    const want = Math.max(0, Math.min(this.stars, Math.floor((this.t - 0.35) / 0.38) + 1));
    if (this.t > 0.35 && want > this.shown) {
      this.shown = want;
      g.audio.play('star', 0.8, 1 + this.shown * 0.12); g.vibe(20);
      g.fx.burst(this.r.cx + (this.shown - 2) * 70 * g.dp, this.r.t + 110 * g.dp, Pal.GOLD, 18, 300 * g.dp, 5 * g.dp);
    }
  }
  draw(c) {
    const g = this.g, r = this.r, L = this.L, prog = g.prog;
    c.save(); this.scaleIn(c, r);
    Ui.panel(c, r, 26 * g.dp);
    this.title(c, r, this.stars === 3 ? 'Виртуоз!' : 'Браво!');
    for (let k = 0; k <= 2; k++) {
      const big = k < this.shown;
      Ui.star(c, r.cx + (k - 1) * 70 * g.dp, r.t + 108 * g.dp - (k === 1 ? 14 * g.dp : 0), 30 * g.dp * (big ? 1.1 : 1), big);
    }
    Ui.txtM(c, 'Уровень ' + L.spec.num + ' пройден за ' + L.movesAtGoal + ' ход.', r.cx, r.t + 162 * g.dp, 15 * g.dp, 0xFFFFE9C0);
    Ui.txt(c, 'Очки: ' + L.board.score, r.cx, r.t + 192 * g.dp, 22 * g.dp);
    Ui.txt(c, '★ +' + this.gain + ' в копилку (всего ' + prog.wallet + ')', r.cx, r.t + 222 * g.dp, 17 * g.dp, Pal.GOLD);
    if (prog.streakOpen) Ui.txtM(c, 'Серия побед: ' + prog.streak + ' · на старте следующего: +' + Math.min(prog.streak, 4) + ' спецфишк.', r.cx, r.t + 248 * g.dp, 13 * g.dp, 0xFFE6EDF7);
    this.btns.draw(c);
    c.restore();
  }
}

class ResultOverlay extends Overlay {
  constructor(L, gain) {
    super(L);
    const g = this.g, prog = g.prog;
    this.gain = gain;
    this.r = this.panelRect(0.86, 0.46);
    const again = L.mode === MODE_ENDLESS ? () => g.go(new LevelScene(g, LevelGen.modeSpec(MODE_ENDLESS, prog.maxLevel), MODE_ENDLESS))

    this.stack(this.r, this.r.t + this.r.h * 0.56, [
      [L.mode === MODE_BONUS ? 'Мастерская' : 'Ещё раз', GREEN, again],

    ]);

  draw(c) {
    const g = this.g, r = this.r, L = this.L, prog = g.prog;

    if (L.mode !== MODE_BONUS) Ui.txt(c, 'Рекорд: ' + prog.modeBest(L.mode === MODE_ENDLESS ? 'endless' : 'arcade'), r.cx, r.t + 124 * g.dp, 16 * g.dp);

    c.restore();
  }
